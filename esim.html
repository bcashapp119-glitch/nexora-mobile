<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Mobile — eSIM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 22px;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    .status {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      text-align: center;
      color: #6b7280;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .plan {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .country {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .plan-name {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .details {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .price {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">Nexora Mobile</div>
    <a class="back" href="index.html">← Home</a>
  </div>
</header>

<main>

  <h1>🌍 eSIM Plans</h1>
  <p class="subtitle">
    Search for a country and choose an eSIM plan.
  </p>

  <div class="search-box">
    <input
      id="searchInput"
      type="search"
      placeholder="Search country, e.g. USA, UK, Germany..."
      autocomplete="off"
    >
  </div>

  <div id="status" class="status">
    Loading real eSIM plans...
  </div>

  <div id="plans" class="plans"></div>

</main>

<script>
  /*
    IMPORTANT:
    The customer page talks to YOUR backend.
    It does NOT contain the eSIM Go API key.
  */

  const API_BASE = "https://YOUR-NEXORA-AI-BACKEND.vercel.app";

  const plansContainer = document.getElementById("plans");
  const statusBox = document.getElementById("status");
  const searchInput = document.getElementById("searchInput");

  let allPlans = [];

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getCountry(plan) {
    return plan?.countries?.[0]?.name || "International";
  }

  function getData(plan) {
    if (plan.dataAmountMB === -1) {
      return "Unlimited data";
    }

    const gb = plan.dataAmountMB / 1000;

    if (gb >= 1) {
      return `${gb} GB`;
    }

    return `${plan.dataAmountMB} MB`;
  }

  function getSpeed(plan) {
    if (!Array.isArray(plan.speed) || plan.speed.length === 0) {
      return "Network speed varies";
    }

    return plan.speed.join(" / ");
  }

  function renderPlans(plans) {

    if (!plans.length) {
      plansContainer.innerHTML = `
        <div class="empty">
          No eSIM plans found for that search.
        </div>
      `;

      return;
    }

    plansContainer.innerHTML = plans.map(plan => {

      const country = getCountry(plan);
      const data = getData(plan);
      const speed = getSpeed(plan);

      /*
        TEMPORARY SELLING PRICE

        We are NOT using the provider price directly.
        The real Nexora selling-price system will be added
        after we decide your markup and payment system.

        For now, this is only a display calculation.
      */

      const providerPrice = Number(plan.providerPrice || 0);

      const nexoraPrice = providerPrice > 0
        ? (providerPrice * 2).toFixed(2)
        : "0.00";

      return `
        <div class="plan">

          <div class="country">
            ${escapeHTML(country)}
          </div>

          <div class="plan-name">
            ${escapeHTML(plan.name)}
          </div>

          <div class="details">
            <div>📶 Data: ${escapeHTML(data)}</div>
            <div>📅 Validity: ${escapeHTML(plan.duration)} days</div>
            <div>📡 Speed: ${escapeHTML(speed)}</div>
          </div>

          <div class="price">
            $${nexoraPrice}
          </div>

          <button
            onclick='selectPlan(${JSON.stringify(plan).replaceAll("'", "&#039;")})'
          >
            View Plan
          </button>

        </div>
      `;

    }).join("");
  }

  function selectPlan(plan) {

    /*
      We are NOT purchasing anything yet.

      This button only lets us test that the real plan
      information is reaching the customer page.
    */

    alert(
      "Selected eSIM\\n\\n" +
      "Country: " + getCountry(plan) + "\\n" +
      "Plan: " + plan.name + "\\n" +
      "Data: " + getData(plan) + "\\n" +
      "Validity: " + plan.duration + " days"
    );
  }

  async function loadPlans() {

    try {

      statusBox.textContent = "Connecting to Nexora backend...";

      /*
        IMPORTANT:
        Change this endpoint ONLY if your backend uses
        a different route.

        We will use:
        /api/esim/plans
      */

      const response = await fetch(
        `${API_BASE}/api/esim/plans`
      );

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.message || "Unable to load eSIM plans."
        );
      }

      allPlans = Array.isArray(data.plans)
        ? data.plans
        : [];

      statusBox.textContent =
        `${allPlans.length} real eSIM plans available`;

      renderPlans(allPlans);

    } catch (error) {

      console.error("Nexora eSIM error:", error);

      statusBox.textContent =
        "Unable to load eSIM plans right now.";

      plansContainer.innerHTML = `
        <div class="empty">
          <strong>eSIM plans are temporarily unavailable.</strong>
          <br><br>
          Please try again later.
        </div>
      `;
    }
  }

  searchInput.addEventListener("input", () => {

    const query = searchInput.value
      .trim()
      .toLowerCase();

    if (!query) {
      renderPlans(allPlans);
      return;
    }

    const filtered = allPlans.filter(plan => {

      const country = getCountry(plan).toLowerCase();

      const name = String(plan.name || "")
        .toLowerCase();

      const description = String(plan.description || "")
        .toLowerCase();

      return (
        country.includes(query) ||
        name.includes(query) ||
        description.includes(query)
      );
    });

    renderPlans(filtered);
  });

  loadPlans();
</script>

</body>
</html>
