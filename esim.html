<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Nexora Mobile — Explore eSIM</title>
<style>
*{
  box-sizing:border-box;
}
html{
  scroll-behavior:smooth;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
  padding-bottom:35px;
}
button,
input{
  font-family:inherit;
}
button{
  cursor:pointer;
}
.app{
  width:100%;
  max-width:700px;
  margin:auto;
}
/* HEADER */
.header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  padding:20px 18px 25px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.back{
  color:white;
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
}
.logo{
  font-size:21px;
  font-weight:800;
}
.ai-small{
  border:0;
  background:white;
  color:#2563eb;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:18px;
}
/* MAIN */
main{
  padding:24px 18px 50px;
}
h1{
  margin:0;
  font-size:28px;
}
.subtitle{
  margin:9px 0 20px;
  color:#6b7280;
  line-height:1.5;
}
/* SEARCH */
.search-box{
  background:white;
  padding:14px;
  border-radius:17px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
  margin-bottom:18px;
}
.search-box input{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:11px;
  font-size:16px;
  outline:none;
}
.search-box input:focus{
  border-color:#2563eb;
}
/* SECTION TITLE */
.section-title{
  font-size:19px;
  font-weight:800;
  margin:23px 0 12px;
}
/* REGION BUTTONS */
.region-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.region{
  border:0;
  background:white;
  border-radius:14px;
  padding:13px 6px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
  font-weight:700;
  color:#111827;
}
.region span{
  display:block;
  font-size:23px;
  margin-bottom:5px;
}
.region.active{
  background:#2563eb;
  color:white;
}
/* DESTINATIONS */
.destination-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}
.destination{
  border:0;
  background:white;
  border-radius:16px;
  padding:15px;
  text-align:left;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}
.destination .flag{
  font-size:27px;
}
.destination strong{
  display:block;
  margin-top:7px;
}
.destination small{
  color:#6b7280;
}
/* TOOLS */
.tools{
  display:grid;
  gap:10px;
}
.tool{
  width:100%;
  border:0;
  background:white;
  border-radius:16px;
  padding:16px;
  display:flex;
  gap:13px;
  text-align:left;
  align-items:center;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}
.tool-icon{
  font-size:25px;
}
.tool small{
  color:#6b7280;
}
/* STATUS */
.status{
  background:white;
  padding:15px;
  border-radius:14px;
  text-align:center;
  color:#6b7280;
  margin:18px 0;
}
.success{
  color:#047857;
  font-weight:bold;
}
.error{
  color:#b91c1c;
  font-weight:bold;
}
/* PLANS */
.plans{
  display:grid;
  gap:13px;
}
.plan{
  background:white;
  border-radius:19px;
  padding:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}
.plan-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.country{
  font-size:19px;
  font-weight:800;
}
.plan-name{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}
.badge{
  background:#eff6ff;
  color:#2563eb;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
  height:max-content;
}
.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin:17px 0;
}
.detail{
  background:#f5f7fb;
  border-radius:10px;
  padding:10px;
  font-size:13px;
}
.detail strong{
  display:block;
  margin-top:3px;
}
.price-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.price{
  font-size:22px;
  font-weight:800;
}
.view-button{
  border:0;
  background:#2563eb;
  color:white;
  padding:12px 17px;
  border-radius:11px;
  font-weight:800;
}
/* EMPTY */
.empty{
  background:white;
  border-radius:17px;
  padding:30px 18px;
  text-align:center;
  color:#6b7280;
}
/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:500;
  align-items:flex-end;
  justify-content:center;
  padding:0;
}
.modal.show{
  display:flex;
}
.modal-card{
  background:white;
  width:100%;
  max-width:700px;
  border-radius:25px 25px 0 0;
  padding:23px;
  max-height:85vh;
  overflow-y:auto;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.close{
  border:0;
  background:#f3f4f6;
  width:37px;
  height:37px;
  border-radius:50%;
  font-size:20px;
}
.modal-card p{
  color:#6b7280;
  line-height:1.5;
}
.modal-details{
  background:#f5f7fb;
  padding:15px;
  border-radius:14px;
  display:grid;
  gap:10px;
  margin:15px 0;
}
.primary-button{
  width:100%;
  border:0;
  background:#2563eb;
  color:white;
  padding:14px;
  border-radius:12px;
  font-weight:800;
  font-size:15px;
}
.secondary-button{
  width:100%;
  border:1px solid #d1d5db;
  background:white;
  padding:13px;
  border-radius:12px;
  font-weight:700;
  margin-top:9px;
}
/* WHATSAPP */
.whatsapp{
  background:#22c55e;
  color:white;
}
/* MOBILE */
@media(max-width:430px){
  .region-grid{
    grid-template-columns:repeat(2,1fr);
  }
  .details{
    grid-template-columns:1fr 1fr;
  }
  h1{
    font-size:25px;
  }
}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="header-row">
<a class="back" href="dashboard.html">
  ← Home
</a>
<div class="logo">
  Nexora eSIM
</div>
<button class="ai-small" id="aiButton">
  🤖
</button>
  </div>
</header>
<main>
  <h1>Explore eSIM 🌍</h1>
  <p class="subtitle">
    Find an eSIM for your destination, region or worldwide travel.
    Choose your destination and compare available plans.
  </p>
  <!-- SEARCH -->
  <div class="search-box">
<input
  id="searchInput"
  type="search"
  placeholder="Search country or destination..."
  autocomplete="off"
>
  </div>
  <!-- REGIONS -->
  <div class="section-title">
    Browse by Region
  </div>
  <div class="region-grid">
<button class="region active" data-region="all">
  <span>🌎</span>
  Global
</button>
<button class="region" data-region="Europe">
  <span>🇪🇺</span>
  Europe
</button>
<button class="region" data-region="Asia">
  <span>🌏</span>
  Asia
</button>
<button class="region" data-region="Africa">
  <span>🌍</span>
  Africa
</button>
<button class="region" data-region="Americas">
  <span>🌎</span>
  Americas
</button>
<button class="region" data-region="Middle East">
  <span>🕌</span>
  Middle East
</button>
  </div>
  <!-- POPULAR -->
  <div class="section-title">
    Popular Destinations
  </div>
  <div class="destination-grid">
<button class="destination" data-country="United States">
  <span class="flag">🇺🇸</span>
  <strong>United States</strong>
  <small>View available plans</small>
</button>
<button class="destination" data-country="France">
  <span class="flag">🇫🇷</span>
  <strong>France</strong>
  <small>View available plans</small>
</button>
<button class="destination" data-country="Spain">
  <span class="flag">🇪🇸</span>
  <strong>Spain</strong>
  <small>View available plans</small>
</button>
<button class="destination" data-country="United Kingdom">
  <span class="flag">🇬🇧</span>
  <strong>United Kingdom</strong>
  <small>View available plans</small>
</button>
  </div>
  <!-- TOOLS -->
  <div class="section-title">
    eSIM Tools
  </div>
  <div class="tools">
<button class="tool" id="compatibilityButton">
  <span class="tool-icon">📱</span>
  <span>
    <strong>Check Compatibility</strong><br>
    <small>Check if your phone supports eSIM</small>
  </span>
</button>
<button class="tool" id="installationButton">
  <span class="tool-icon">⚙️</span>
  <span>
    <strong>Installation Guide</strong><br>
    <small>Learn how to install your eSIM</small>
  </span>
</button>
<button class="tool" id="diagnosticsButton">
  <span class="tool-icon">🩺</span>
  <span>
    <strong>eSIM Diagnostics</strong><br>
    <small>Troubleshoot connection problems</small>
  </span>
</button>
  </div>
  <!-- STATUS -->
  <div id="status" class="status">
    Loading eSIM catalog...
  </div>
  <!-- PLANS -->
  <div class="section-title">
    Available Plans
  </div>
  <div id="plans" class="plans">
<div class="empty">
  Loading plans...
</div>
  </div>
</main>
</div>
<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-card">
<div class="modal-head">
  <h2 id="modalTitle">
    eSIM
  </h2>
  <button class="close" id="closeModal">
    ×
  </button>
</div>
<div id="modalBody"></div>
  </div>
</div>
<script type="module">
/*
============================================================
NEXORA MOBILE 2.0 — eSIM EXPLORE
============================================================
IMPORTANT:
The eSIM Go API key is NOT stored here.
The customer browser communicates with the Nexora backend.
Browser
   ↓
Nexora Backend
   ↓
eSIM Go
============================================================
*/
/* BACKEND */
const API_BASE =
  "https://nexora-ai-backend-git-main-nexora-mobile.vercel.app";
const PLANS_ENDPOINT =
  `${API_BASE}/api/esim/plans`;
/* ELEMENTS */
const searchInput =
  document.getElementById("searchInput");
const plansContainer =
  document.getElementById("plans");
const statusBox =
  document.getElementById("status");
const modal =
  document.getElementById("modal");
const modalTitle =
  document.getElementById("modalTitle");
const modalBody =
  document.getElementById("modalBody");
const closeModalButton =
  document.getElementById("closeModal");
/* STATE */
let allPlans = [];
let selectedRegion = "all";
let selectedPlan = null;
/* SAFE HTML */
function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
/* COUNTRY */
function getCountry(plan){
  if(
    Array.isArray(plan?.countries) &&
    plan.countries.length
  ){
    return (
      plan.countries[0]?.name ||
      "International"
    );
  }
  return (
    plan?.country ||
    "International"
  );
}
/* REGION */
function getRegion(plan){
  if(
    Array.isArray(plan?.countries) &&
    plan.countries.length
  ){
    return String(
      plan.countries[0]?.region || ""
    );
  }
  return String(
    plan?.region || ""
  );
}
/* DATA */
function getData(plan){
  const amount =
    Number(plan?.dataAmountMB ?? 0);
  if(amount === -1){
    return "Unlimited";
  }
  if(amount >= 1000){
    const gb =
      amount / 1000;
    return `${gb} GB`;
  }
  if(amount > 0){
    return `${amount} MB`;
  }
  return "Data varies";
}
/* VALIDITY */
function getValidity(plan){
  const days =
    Number(plan?.duration ?? 0);
  if(days > 0){
    return `${days} days`;
  }
  return "Validity varies";
}
/* SPEED */
function getSpeed(plan){
  if(
    Array.isArray(plan?.speed) &&
    plan.speed.length
  ){
    return plan.speed.join(" / ");
  }
  return "4G / 5G where available";
}
/* PRICE */
function getPrice(plan){
  const price =
    Number(
      plan?.providerPrice ??
      plan?.price ??
      0
    );
  if(
    !Number.isFinite(price) ||
    price <= 0
  ){
    return "Price unavailable";
  }
  /*
  Temporary display only.
  Final Nexora pricing will be controlled
  from the backend before payments are enabled.
  */
  const sellingPrice =
    price * 2;
  return `$${sellingPrice.toFixed(2)}`;
}
/* RENDER */
function renderPlans(plans){
  if(
    !Array.isArray(plans) ||
    plans.length === 0
  ){
    plansContainer.innerHTML = `
      <div class="empty">
        No plans found for this destination.
      </div>
    `;
    return;
  }
  plansContainer.innerHTML =
    plans.map((plan,index)=>{
      const country =
        getCountry(plan);
      const data =
        getData(plan);
      const validity =
        getValidity(plan);
      const speed =
        getSpeed(plan);
      const price =
        getPrice(plan);
      const name =
        plan?.name ||
        "Nexora eSIM Plan";
      return `
        <article class="plan">
          <div class="plan-top">
            <div>
              <div class="country">
                ${escapeHTML(country)}
              </div>
              <div class="plan-name">
                ${escapeHTML(name)}
              </div>
            </div>
            <div class="badge">
              eSIM
            </div>
          </div>
          <div class="details">
            <div class="detail">
              📶
              <strong>${escapeHTML(data)}</strong>
              Data
            </div>
            <div class="detail">
              📅
              <strong>${escapeHTML(validity)}</strong>
              Validity
            </div>
            <div class="detail">
              📡
              <strong>${escapeHTML(speed)}</strong>
              Network
            </div>
            <div class="detail">
              🌍
              <strong>${escapeHTML(country)}</strong>
              Destination
            </div>
          </div>
          <div class="price-row">
            <div class="price">
              ${escapeHTML(price)}
            </div>
            <button
              class="view-button"
              data-plan-index="${index}"
            >
              View Plan
            </button>
          </div>
        </article>
      `;
    }).join("");
  plansContainer
    .querySelectorAll("[data-plan-index]")
    .forEach(button=>{
      button.addEventListener(
        "click",
        ()=>{
          const index =
            Number(
              button.dataset.planIndex
            );
          openPlan(plans[index]);
        }
      );
    });
}
/* FILTER */
function filterPlans(){
  const query =
    searchInput.value
      .trim()
      .toLowerCase();
  const filtered =
    allPlans.filter(plan=>{
      const country =
        getCountry(plan)
          .toLowerCase();
      const name =
        String(
          plan?.name || ""
        ).toLowerCase();
      const region =
        getRegion(plan)
          .toLowerCase();
      const description =
        String(
          plan?.description || ""
        ).toLowerCase();
      const matchesSearch =
        !query ||
        country.includes(query) ||
        name.includes(query) ||
        region.includes(query) ||
        description.includes(query);
      const matchesRegion =
        selectedRegion === "all" ||
        region.includes(
          selectedRegion.toLowerCase()
        );
      return (
        matchesSearch &&
        matchesRegion
      );
    });
  renderPlans(filtered);
}
/* REGION BUTTONS */
document
  .querySelectorAll(".region")
  .forEach(button=>{
    button.addEventListener(
      "click",
      ()=>{
        document
          .querySelectorAll(".region")
          .forEach(item=>{
            item.classList.remove("active");
          });
        button.classList.add("active");
        selectedRegion =
          button.dataset.region;
        filterPlans();
      }
    );
  });
/* SEARCH */
searchInput.addEventListener(
  "input",
  filterPlans
);
/* POPULAR DESTINATION */
document
  .querySelectorAll(".destination")
  .forEach(button=>{
    button.addEventListener(
      "click",
      ()=>{
        const country =
          button.dataset.country;
        searchInput.value =
          country;
        selectedRegion =
          "all";
        document
          .querySelectorAll(".region")
          .forEach(item=>{
            item.classList.remove("active");
          });
        document
          .querySelector(
            '[data-region="all"]'
          )
          .classList.add("active");
        filterPlans();
        window.scrollTo({
          top:document.body.scrollHeight,
          behavior:"smooth"
        });
      }
    );
  });
/* PLAN MODAL */
function openPlan(plan){
  if(!plan){
    return;
  }
  selectedPlan =
    plan;
  const country =
    getCountry(plan);
  const data =
    getData(plan);
  const validity =
    getValidity(plan);
  const speed =
    getSpeed(plan);
  const price =
    getPrice(plan);
  const name =
    plan?.name ||
    "Nexora eSIM Plan";
  modalTitle.textContent =
    `${country} eSIM`;
  modalBody.innerHTML = `
    <p>
      Review your eSIM plan before continuing.
    </p>
    <div class="modal-details">
      <div>
        🌍
        <strong>Destination:</strong>
        ${escapeHTML(country)}
      </div>
      <div>
        📦
        <strong>Plan:</strong>
        ${escapeHTML(name)}
      </div>
      <div>
        📶
        <strong>Data:</strong>
        ${escapeHTML(data)}
      </div>
      <div>
        📅
        <strong>Validity:</strong>
        ${escapeHTML(validity)}
      </div>
      <div>
        📡
        <strong>Network:</strong>
        ${escapeHTML(speed)}
      </div>
      <div>
        💰
        <strong>Price:</strong>
        ${escapeHTML(price)}
      </div>
    </div>
    <button
      class="primary-button"
      id="continueButton"
    >
      Continue
    </button>
    <button
      class="secondary-button"
      id="modalCloseButton"
    >
      Go Back
    </button>
  `;
  modal.classList.add("show");
  document
    .getElementById("modalCloseButton")
    .onclick =
      closeModal;
  document
    .getElementById("continueButton")
    .onclick =
      continuePurchase;
}
/* CLOSE */
function closeModal(){
  modal.classList.remove("show");
  selectedPlan =
    null;
}
closeModalButton.onclick =
  closeModal;
modal.addEventListener(
  "click",
  event=>{
    if(event.target === modal){
      closeModal();
    }
  }
);
/* PURCHASE */
function continuePurchase(){
  if(!selectedPlan){
    return;
  }
  /*
  Payment is intentionally NOT activated
  in this frontend yet.
  Next stage:
  Nexora wallet/payment
  →
  backend order validation
  →
  eSIM Go order
  →
  QR code / activation details
  */
  modalBody.innerHTML = `
    <h3>Ready for purchase</h3>
    <p>
      Your eSIM plan has been selected.
    </p>
    <div class="modal-details">
      <div>
        🌍
        <strong>
          ${escapeHTML(
            getCountry(selectedPlan)
          )}
        </strong>
      </div>
      <div>
        📶
        <strong>
          ${escapeHTML(
            getData(selectedPlan)
          )}
        </strong>
      </div>
      <div>
        📅
        <strong>
          ${escapeHTML(
            getValidity(selectedPlan)
          )}
        </strong>
      </div>
      <div>
        💰
        <strong>
          ${escapeHTML(
            getPrice(selectedPlan)
          )}
        </strong>
      </div>
    </div>
    <button
      class="primary-button"
      id="purchaseNextButton"
    >
      Continue to Secure Checkout
    </button>
  `;
  document
    .getElementById("purchaseNextButton")
    .onclick = ()=>{
      alert(
        "Nexora Mobile checkout will be connected to the real payment system next."
      );
    };
}
/* TOOLS */
document
  .getElementById("compatibilityButton")
  .onclick = ()=>{
    modalTitle.textContent =
      "📱 eSIM Compatibility";
    modalBody.innerHTML = `
      <p>
        Check whether your phone supports eSIM before purchasing.
      </p>
      <div class="modal-details">
        <div>
          📱 iPhone
          <strong>
            Many recent iPhone models support eSIM.
          </strong>
        </div>
        <div>
          📱 Android
          <strong>
            Support depends on the exact model and region.
          </strong>
        </div>
      </div>
      <p>
        Nexora's full automatic device checker will be connected here.
      </p>
    `;
    modal.classList.add("show");
  };
/* INSTALLATION */
document
  .getElementById("installationButton")
  .onclick = ()=>{
    modalTitle.textContent =
      "⚙️ Installation Guide";
    modalBody.innerHTML = `
      <p>
        After purchasing your eSIM, Nexora will provide
        the activation information needed to install it.
      </p>
      <div class="modal-details">
        <div>
          1️⃣
          <strong>
            Purchase your eSIM
          </strong>
        </div>
        <div>
          2️⃣
          <strong>
            Receive your activation details
          </strong>
        </div>
        <div>
          3️⃣
          <strong>
            Add the eSIM to your phone
          </strong>
        </div>
        <div>
          4️⃣
          <strong>
            Turn on the eSIM data line
          </strong>
        </div>
      </div>
    `;
    modal.classList.add("show");
  };

/* LOAD REAL PLANS */
async function loadPlans(){
  statusBox.textContent =
    "Connecting to Nexora eSIM service...";
  plansContainer.innerHTML = `
    <div class="empty">
      Loading available plans...
    </div>
  `;
  try{
    const response =
      await fetch(
        PLANS_ENDPOINT,
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store"
        }
      );
    let data;
    try{
      data =
        await response.json();
    }catch{
      throw new Error(
        "Backend did not return JSON."
      );
    }
    if(!response.ok){
      throw new Error(
        data?.message ||
        `HTTP ${response.status}`
      );
    }
    if(
      !data ||
      data.success !== true
    ){
      throw new Error(
        data?.message ||
        "Invalid backend response."
      );
    }
    if(
      !Array.isArray(data.plans)
    ){
      throw new Error(
        "Invalid plans list."
      );
    }
    allPlans =
      data.plans;
    statusBox.innerHTML = `
      <span class="success">
        ✓ ${allPlans.length}
        eSIM plans available
      </span>
    `;
    renderPlans(allPlans);
    /*
    Read destination from dashboard URL
    if one was supplied.
    */
    const params =
      new URLSearchParams(
        window.location.search
      );
    const destination =
      params.get("destination");
    if(destination){
      searchInput.value =
        destination;
      filterPlans();
    }
  }catch(error){
    console.error(
      "Nexora eSIM error:",
      error
    );
    statusBox.innerHTML = `
      <span class="error">
        eSIM catalog unavailable
      </span>
    `;
    plansContainer.innerHTML = `
      <div class="empty">
        <strong>
          We couldn't load the eSIM catalog.
        </strong>
        <br><br>
        Please try again shortly.
        <br><br>
        The eSIM provider API remains protected
        on the Nexora backend.
      </div>
    `;
  }
}
/* START */
loadPlans();
