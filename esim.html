<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Nexora Mobile — eSIM Plans</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}
button {
  font-family: inherit;
  cursor: pointer;
}
.app {
  width: 100%;
  max-width: 700px;
  margin: auto;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  padding: 20px 18px;
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-size: 20px;
  font-weight: 800;
}
.back {
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}
main {
  padding: 25px 18px 50px;
}
h1 {
  margin: 0;
  font-size: 27px;
}
.subtitle {
  color: #6b7280;
  line-height: 1.5;
  margin: 9px 0 22px;
}
.status {
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 15px;
  line-height: 1.5;
  font-size: 14px;
}
.loading {
  background: #eff6ff;
  color: #1e40af;
}
.error {
  background: #fef2f2;
  color: #b91c1c;
}
.success {
  background: #ecfdf5;
  color: #047857;
}
.hidden {
  display: none;
}
.plan {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.plan-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.country {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 6px;
}
.plan-name {
  color: #6b7280;
  font-size: 13px;
  word-break: break-word;
}
.price {
  color: #2563eb;
  font-size: 20px;
  font-weight: 800;
  white-space: nowrap;
}
.details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 15px;
}
.detail {
  background: #f5f7fb;
  border-radius: 10px;
  padding: 11px;
  font-size: 13px;
  line-height: 1.4;
}
.detail strong {
  display: block;
  margin-top: 3px;
  color: #111827;
}
.primary-button,
.retry-button {
  width: 100%;
  border: 0;
  background: #2563eb;
  color: white;
  padding: 14px;
  border-radius: 11px;
  font-size: 15px;
  font-weight: 800;
  margin-top: 15px;
}
.empty {
  background: white;
  border-radius: 18px;
  padding: 25px;
  text-align: center;
  color: #6b7280;
}
@media(max-width:430px) {
  h1 {
    font-size: 24px;
  }
  .details {
    grid-template-columns: 1fr;
  }
  .plan-top {
    flex-direction: column;
  }
  .price {
    font-size: 19px;
  }
}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="header-row">
    <a class="back" href="index.html">
      ← Home
    </a>
    <div class="logo">
      Nexora Mobile
    </div>
  </div>
</header>
<main>
<h1>eSIM Plans</h1>
<p class="subtitle">
  Choose an international eSIM plan and continue securely to checkout.
</p>
<div id="loadingBox" class="status loading">
  Connecting to Nexora Mobile eSIM service...
</div>
<div id="errorBox" class="status error hidden">
  <strong>Unable to load eSIM plans.</strong>
  <br><br>
  <span id="errorMessage">
    Please try again.
  </span>
  <button
    type="button"
    class="retry-button"
    id="retryButton">
    Try Again
  </button>
</div>
<div id="successBox" class="status success hidden">
  eSIM plans loaded successfully.
</div>
<div id="plansContainer"></div>
<div id="emptyBox" class="empty hidden">
  No eSIM plans are currently available.
</div>
</main>
</div>
<script>
/*
=================================================
NEXORA MOBILE BACKEND
=================================================
This is the Render backend you confirmed is online.
=================================================
*/
const API_URL =
  "https://nexora-ai-backend-hvg7.onrender.com/api/esim/plans";
const loadingBox =
  document.getElementById("loadingBox");
const errorBox =
  document.getElementById("errorBox");
const errorMessage =
  document.getElementById("errorMessage");
const successBox =
  document.getElementById("successBox");
const plansContainer =
  document.getElementById("plansContainer");
const emptyBox =
  document.getElementById("emptyBox");
const retryButton =
  document.getElementById("retryButton");
function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function getCountry(plan) {
  if (
    Array.isArray(plan?.countries) &&
    plan.countries.length
  ) {
    return (
      plan.countries[0]?.name ||
      "International"
    );
  }
  return plan?.country || "International";
}
function getData(plan) {
  const amount =
    Number(plan?.dataAmountMB ?? 0);
  if (amount === -1) {
    return "Unlimited";
  }
  if (amount >= 1000) {
    const gb = amount / 1000;
    return `${gb} GB`;
  }
  if (amount > 0) {
    return `${amount} MB`;
  }
  return "Data varies";
}
function getValidity(plan) {
  const days =
    Number(plan?.duration ?? 0);
  if (days > 0) {
    return `${days} days`;
  }
  return "Validity varies";
}
function getSpeed(plan) {
  if (
    Array.isArray(plan?.speed) &&
    plan.speed.length
  ) {
    return plan.speed.join(" / ");
  }
  return "4G / 5G where available";
}
function getPrice(plan) {
  const providerPrice =
    Number(plan?.providerPrice ?? 0);
  if (
    !Number.isFinite(providerPrice) ||
    providerPrice <= 0
  ) {
    return "Price unavailable";
  }
  /*
    Temporary selling price:
    provider price × 2
  */
  const sellingPrice =
    providerPrice * 2;
  return `$${sellingPrice.toFixed(2)}`;
}
function showLoading() {
  loadingBox.classList.remove("hidden");
  errorBox.classList.add("hidden");
  successBox.classList.add("hidden");
  emptyBox.classList.add("hidden");
}
function showError(message) {
  loadingBox.classList.add("hidden");
  successBox.classList.add("hidden");
  emptyBox.classList.add("hidden");
  errorBox.classList.remove("hidden");
  errorMessage.textContent =
    message ||
    "Unable to load eSIM plans.";
}
function showSuccess() {
  loadingBox.classList.add("hidden");
  errorBox.classList.add("hidden");
  successBox.classList.remove("hidden");
}
function openCheckout(plan) {
  try {
    sessionStorage.setItem(
      "nexoraSelectedPlan",
      JSON.stringify(plan)
    );
  } catch (error) {
    console.error(error);
    alert(
      "Unable to prepare checkout. Please try again."
    );
    return;
  }
  window.location.href =
    "checkout.html";
}
function createPlanCard(plan) {
  const card =
    document.createElement("div");
  card.className = "plan";
  const country =
    getCountry(plan);
  const data =
    getData(plan);
  const validity =
    getValidity(plan);
  const speed =
    getSpeed(plan);
  const price =
    getPrice(plan);
  card.innerHTML = `
    <div class="plan-top">
      <div>
        <div class="country">
          🌍 ${escapeHTML(country)}
        </div>
        <div class="plan-name">
          ${escapeHTML(
            plan?.name ||
            "Nexora eSIM Plan"
          )}
        </div>
      </div>
      <div class="price">
        ${escapeHTML(price)}
      </div>
    </div>
    <div class="details">
      <div class="detail">
        📶 Data
        <strong>
          ${escapeHTML(data)}
        </strong>
      </div>
      <div class="detail">
        📅 Validity
        <strong>
          ${escapeHTML(validity)}
        </strong>
      </div>
      <div class="detail">
        📡 Network
        <strong>
          ${escapeHTML(speed)}
        </strong>
      </div>
      <div class="detail">
        🆔 Plan ID
        <strong>
          ${escapeHTML(plan?.id || "—")}
        </strong>
      </div>
    </div>
  `;
  const button =
    document.createElement("button");
  button.type = "button";
  button.className =
    "primary-button";
  button.textContent =
    "Continue to Checkout";
  button.onclick = function() {
    openCheckout(plan);
  };
  card.appendChild(button);
  return card;
}
async function loadPlans() {
  showLoading();
  plansContainer.innerHTML = "";
  try {
    const response =
      await fetch(API_URL, {
        method: "GET",
        headers: {
          "Accept": "application/json"
        },
        cache: "no-store"
      });
    if (!response.ok) {
      throw new Error(
        `Backend returned HTTP ${response.status}`
      );
    }
    const result =
      await response.json();
    console.log(
      "Nexora Mobile eSIM API:",
      result
    );
    if (
      !result ||
      result.success !== true
    ) {
      throw new Error(
        "The eSIM service returned an unsuccessful response."
      );
    }
    const plans =
      Array.isArray(result.plans)
        ? result.plans
        : [];
    if (plans.length === 0) {
      loadingBox.classList.add("hidden");
      successBox.classList.add("hidden");
      emptyBox.classList.remove("hidden");
      return;
    }
    plans.forEach(function(plan) {
      const card =
        createPlanCard(plan);
      plansContainer.appendChild(card);
    });
    showSuccess();
  } catch (error) {
    console.error(
      "Nexora Mobile eSIM error:",
      error
    );
    showError(
      "Unable to connect to the Nexora Mobile eSIM service. Please try again."
    );
  }
}
retryButton.onclick =
  function() {
    loadPlans();
  };
loadPlans();
</script>
</body>
</html>
