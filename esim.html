<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora International eSIM</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f3f6fb;
padding:20px;
}

.container{
max-width:420px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#2563eb;
}

select{
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

.plan{
background:#eef2ff;
padding:15px;
margin:10px 0;
border-radius:15px;
cursor:pointer;
}

.plan.active{
border:2px solid #2563eb;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

</style>

</head>


<body>


<div class="container">


<h1>🌍 International eSIM</h1>


<select id="country">

<option>USA 🇺🇸</option>
<option>UK 🇬🇧</option>
<option>Canada 🇨🇦</option>
<option>UAE 🇦🇪</option>
<option>France 🇫🇷</option>
<option>Germany 🇩🇪</option>
<option>Japan 🇯🇵</option>
<option>South Africa 🇿🇦</option>

</select>



<div class="plan" data-price="5000">
<b>1GB Data</b>
<p>7 Days</p>
<p>₦5,000</p>
</div>



<div class="plan" data-price="15000">
<b>5GB Data</b>
<p>30 Days</p>
<p>₦15,000</p>
</div>



<div class="plan" data-price="25000">
<b>10GB Data</b>
<p>30 Days</p>
<p>₦25,000</p>
</div>



<button id="buy">
Buy eSIM
</button>


<p id="message"></p>


</div>



<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
updateDoc,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



const firebaseConfig = {

apiKey:"AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",

authDomain:"nexora-mobile-af02f.firebaseapp.com",

projectId:"nexora-mobile-af02f",

storageBucket:"nexora-mobile-af02f.firebasestorage.app",

messagingSenderId:"498265618137",

appId:"1:498265618137:web:a1ffebae8eda0b88abf0c8",

measurementId:"G-8494CNWZKL"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



let user = null;

let selectedPlan = null;



onAuthStateChanged(auth,(currentUser)=>{

user=currentUser;

});



document.querySelectorAll(".plan").forEach(plan=>{


plan.onclick=()=>{


document.querySelectorAll(".plan")
.forEach(p=>p.classList.remove("active"));


plan.classList.add("active");


selectedPlan = Number(plan.dataset.price);


};


});





document.getElementById("buy").onclick = async()=>{


if(!user){

document.getElementById("message").innerHTML =
"Please login first";

return;

}



if(!selectedPlan){

document.getElementById("message").innerHTML =
"Select a plan first";

return;

}



let country =
document.getElementById("country").value;



const userRef = doc(
db,
"users",
user.uid
);



const userSnap = await getDoc(userRef);



let wallet =
userSnap.data().wallet || 0;



if(wallet < selectedPlan){

document.getElementById("message").innerHTML =
"Insufficient wallet balance";

return;

}



await updateDoc(userRef,{

wallet: wallet - selectedPlan

});





await addDoc(collection(db,"transactions"),{


userId:user.uid,

type:"eSIM Purchase",

country:country,

amount:selectedPlan,

status:"Successful",

createdAt:serverTimestamp()


});



document.getElementById("message").innerHTML =
"eSIM order successful";


};


</script>


</body>

</html>
