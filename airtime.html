<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Airtime</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f3f6fb;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#2563eb;
}

input,select{
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

</style>

</head>

<body>


<div class="container">

<h1>Buy Airtime</h1>


<select id="network">

<option>MTN</option>
<option>Airtel</option>
<option>Glo</option>
<option>9mobile</option>

</select>


<input id="phone" placeholder="Phone Number">


<input id="amount" type="number" placeholder="Amount">


<button id="buy">
Buy Airtime
</button>


<p id="message"></p>


</div>


<script>

document.getElementById("buy").onclick=()=>{

let network=document.getElementById("network").value;

let phone=document.getElementById("phone").value;

let amount=document.getElementById("amount").value;


document.getElementById("message").innerHTML =
"Preparing "+network+" airtime for "+phone+" amount ₦"+amount;


};

</script>


</body>
</html>
