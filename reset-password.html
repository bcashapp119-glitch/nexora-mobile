<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Mobile - Reset Password</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }
    .logo {
      text-align: center;
      color: #2563eb;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    h2 {
      text-align: center;
      color: #111827;
      margin: 10px 0;
    }
    .description {
      text-align: center;
      color: #6b7280;
      line-height: 1.5;
      font-size: 14px;
      margin-bottom: 22px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      margin-bottom: 14px;
    }
    input:focus {
      border-color: #2563eb;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
      font-size: 14px;
      min-height: 20px;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
<div class="logo">
  Nexora Mobile
</div>
<h2>
  Reset Password
</h2>
<p class="description" id="description">
  Enter your new password below.
</p>
<div id="form">
  <input
    id="password"
    type="password"
    placeholder="New Password"
    autocomplete="new-password"
  >
  <input
    id="confirmPassword"
    type="password"
    placeholder="Confirm New Password"
    autocomplete="new-password"
  >
  <button
    id="resetBtn"
    type="button"
  >
    Change Password
  </button>
</div>
<p id="message"></p>
<a
  class="back"
  href="login.html"
>
  ← Back to Login
</a>
  </div>
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    const firebaseConfig = {
      apiKey:
        "AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",
      authDomain:
        "nexora-mobile-af02f.firebaseapp.com",
      projectId:
        "nexora-mobile-af02f",
      storageBucket:
        "nexora-mobile-af02f.firebasestorage.app",
      messagingSenderId:
        "498265618137",
      appId:
        "1:498265618137:web:a1ffebae8eda0b88abf0c8",
      measurementId:
        "G-8494CNWZKL"
    };
    const app =
      initializeApp(firebaseConfig);
    const auth =
      getAuth(app);
    const passwordInput =
      document.getElementById("password");
    const confirmInput =
      document.getElementById("confirmPassword");
    const resetBtn =
      document.getElementById("resetBtn");
    const message =
      document.getElementById("message");
    const form =
      document.getElementById("form");
    const description =
      document.getElementById("description");
    const params =
      new URLSearchParams(
        window.location.search
      );
    const mode =
      params.get("mode");
    const oobCode =
      params.get("oobCode");
    function showMessage(
      text,
      color
    ) {
      message.textContent =
        text;
      message.style.color =
        color;
    }
    /*
      Make sure this is actually a
      Firebase password-reset request.
    */
    if (
      mode !== "resetPassword" ||
      !oobCode
    ) {
      form.classList.add("hidden");
      description.textContent =
        "This password reset link is invalid or incomplete.";
      showMessage(
        "Please return to Login and request a new password reset email.",
        "#dc2626"
      );
    }
    /*
      Verify that the reset code is valid.
    */
    if (
      mode === "resetPassword" &&
      oobCode
    ) {
      try {
        await verifyPasswordResetCode(
          auth,
          oobCode
        );
      } catch (error) {
        console.error(
          "Reset code error:",
          error
        );
        form.classList.add("hidden");
        description.textContent =
          "This password reset link is no longer valid.";
        showMessage(
          "Please return to Login and request a new reset link.",
          "#dc2626"
        );
      }
    }
    /*
      Change the password.
    */
    resetBtn.addEventListener(
      "click",
      async () => {
        const password =
          passwordInput.value;
        const confirmPassword =
          confirmInput.value;
        if (!password) {
          showMessage(
            "Please enter a new password.",
            "#dc2626"
          );
          return;
        }
        if (password.length < 6) {
          showMessage(
            "Your password must be at least 6 characters.",
            "#dc2626"
          );
          return;
        }
        if (
          password !==
          confirmPassword
        ) {
          showMessage(
            "The passwords do not match.",
            "#dc2626"
          );
          return;
        }
        resetBtn.disabled =
          true;
        resetBtn.textContent =
          "Changing Password...";
        try {
          await confirmPasswordReset(
            auth,
            oobCode,
            password
          );
          form.classList.add(
            "hidden"
          );
          description.textContent =
            "Your Nexora Mobile password has been changed successfully.";
          showMessage(
            "Password changed successfully. You can now log in with your new password.",
            "#15803d"
          );
          setTimeout(
            () => {
              window.location.href =
                "login.html";
            },
            2500
          );
        } catch (error) {
          console.error(
            "Password change error:",
            error
          );
          let text =
            "Unable to change your password. Please request a new reset link.";
          if (
            error.code ===
            "auth/expired-action-code"
          ) {
            text =
              "This reset link has expired. Please request a new one.";
          }
          else if (
            error.code ===
            "auth/invalid-action-code"
          ) {
            text =
              "This reset link is invalid or has already been used.";
          }
          else if (
            error.code ===
            "auth/weak-password"
          ) {
            text =
              "Choose a stronger password.";
          }
          showMessage(
            text,
            "#dc2626"
          );
          resetBtn.disabled =
            false;
          resetBtn.textContent =
            "Change Password";
        }
      }
    );
  </script>
</body>
</html>
