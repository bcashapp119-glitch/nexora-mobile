<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Mobile - Forgot Password</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }
    .logo {
      text-align: center;
      color: #2563eb;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    h2 {
      text-align: center;
      color: #111827;
      margin: 10px 0;
    }
    .description {
      text-align: center;
      color: #6b7280;
      line-height: 1.5;
      font-size: 14px;
      margin-bottom: 22px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      margin-bottom: 14px;
    }
    input:focus {
      border-color: #2563eb;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
      font-size: 14px;
      min-height: 20px;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
<div class="logo">
  Nexora Mobile
</div>
<h2>
  Forgot Password?
</h2>
<p class="description">
  Enter the email address you used to create
  your Nexora Mobile account. We will send
  you a secure password reset email.
</p>
<input
  id="email"
  type="email"
  placeholder="Email Address"
  autocomplete="email"
>
<button
  id="resetBtn"
  type="button"
>
  Send Reset Link
</button>
<p id="message"></p>
<a
  class="back"
  href="login.html"
>
  ← Back to Login
</a>
  </div>
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      sendPasswordResetEmail
    }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    const firebaseConfig = {
      apiKey:
        "AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",
      authDomain:
        "nexora-mobile-af02f.firebaseapp.com",
      projectId:
        "nexora-mobile-af02f",
      storageBucket:
        "nexora-mobile-af02f.firebasestorage.app",
      messagingSenderId:
        "498265618137",
      appId:
        "1:498265618137:web:a1ffebae8eda0b88abf0c8",
      measurementId:
        "G-8494CNWZKL"
    };
    const app =
      initializeApp(firebaseConfig);
    const auth =
      getAuth(app);
    const emailInput =
      document.getElementById("email");
    const resetBtn =
      document.getElementById("resetBtn");
    const message =
      document.getElementById("message");
    function showMessage(
      text,
      color
    ) {
      message.textContent =
        text;
      message.style.color =
        color;
    }
    resetBtn.addEventListener(
      "click",
      async () => {
        const email =
          emailInput.value.trim();
        if (!email) {
          showMessage(
            "Please enter your email address.",
            "#dc2626"
          );
          return;
        }
        resetBtn.disabled =
          true;
        resetBtn.textContent =
          "Sending...";
        try {
          /*
            Firebase will use its standard secure
            password-reset action page.
            We are intentionally NOT adding a
            custom URL here.
          */
          await sendPasswordResetEmail(
            auth,
            email
          );
          showMessage(
            "Password reset email sent. Please check your inbox and follow the link.",
            "#15803d"
          );
          resetBtn.textContent =
            "Reset Email Sent";
        } catch (error) {
          console.error(
            "Nexora password reset error:",
            error
          );
          let errorMessage =
            "Unable to send the password reset email. Please try again.";
          if (
            error.code ===
            "auth/invalid-email"
          ) {
            errorMessage =
              "Please enter a valid email address.";
          }
          else if (
            error.code ===
            "auth/user-not-found"
          ) {
            errorMessage =
              "No Nexora Mobile account was found with that email.";
          }
          else if (
            error.code ===
            "auth/too-many-requests"
          ) {
            errorMessage =
              "Too many attempts. Please wait a little and try again.";
          }
          else if (
            error.code ===
            "auth/network-request-failed"
          ) {
            errorMessage =
              "Network error. Please check your internet connection.";
          }
          else if (
            error.code ===
            "auth/operation-not-allowed"
          ) {
            errorMessage =
              "Email and password sign-in is not enabled in Firebase.";
          }
          showMessage(
            errorMessage,
            "#dc2626"
          );
          resetBtn.disabled =
            false;
          resetBtn.textContent =
            "Send Reset Link";
        }
      }
    );
  </script>
</body>
</html>
