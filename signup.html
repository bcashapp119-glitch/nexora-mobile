<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Create Account</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:90%;
max-width:400px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:14px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
}

#message{
text-align:center;
margin-top:15px;
}
</style>

</head>

<body>

<div class="container">

<h1>Create Nexora Account</h1>

<input id="name" type="text" placeholder="Full Name">

<input id="email" type="email" placeholder="Email Address">

<input id="password" type="password" placeholder="Password">

<button id="signupBtn">Create Account</button>

<p id="message"></p>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",
authDomain: "nexora-mobile-af02f.firebaseapp.com",
projectId: "nexora-mobile-af02f",
storageBucket: "nexora-mobile-af02f.firebasestorage.app",
messagingSenderId: "498265618137",
appId: "1:498265618137:web:a1ffebae8eda0b88abf0c8",
measurementId: "G-8494CNWZKL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


document.getElementById("signupBtn").onclick = async()=>{


const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


const message =
document.getElementById("message");


try{


const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);


const user =
userCredential.user;


await setDoc(
doc(db,"users",user.uid),
{
name:name,
email:email,
wallet:0,
status:"active"
}
);


message.innerHTML="Account created successfully!";


setTimeout(()=>{

window.location.href="login.html";

},1500);


}

catch(error){

message.innerHTML=error.message;

}


};


</script>

</body>
</html>
