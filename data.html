<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Mobile - Buy Data</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      background: #f5f7fb;
      color: #111827;
    }
    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }
    .wallet {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }
    .wallet-title {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 5px;
    }
    .wallet-balance {
      font-size: 25px;
      font-weight: bold;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }
    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }
    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      margin: 15px 0;
      font-size: 14px;
      color: #4b5563;
    }
    .plan-info {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      display: none;
    }
    .plan-info strong {
      display: block;
      margin-bottom: 5px;
    }
    .message {
      display: none;
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }
    .success {
      background: #dcfce7;
      color: #166534;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
    }
    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Buy Data</h1>
  </div>
  <div class="container">
    <div class="wallet">
      <div class="wallet-title">Wallet Balance</div>
      <div class="wallet-balance" id="walletBalance">₦1,500.00</div>
    </div>
    <div class="card">
      <label for="network">Network</label>
      <select id="network">
        <option value="">Select Network</option>
        <option value="mtn">MTN</option>
        <option value="glo">Glo</option>
        <option value="airtel">Airtel</option>
        <option value="9mobile">9mobile</option>
      </select>
      <label for="plan">Data Plan</label>
      <select id="plan" disabled>
        <option value="">Loading live data plans...</option>
      </select>
      <div class="plan-info" id="planInfo">
        <strong id="selectedPlanName"></strong>
        <span id="selectedPlanPrice"></span>
      </div>
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="08012345678"
        maxlength="11"
        inputmode="numeric"
      >
      <button id="buyButton" disabled>
        Buy Data
      </button>
      <div class="status" id="status">
        Loading live data plans...
      </div>
      <div class="message success" id="successMessage"></div>
      <div class="message error" id="errorMessage"></div>
    </div>
    <div class="footer">
      Nexora Mobile • Powered by VTUGate
    </div>
  </div>
<script>
  /*
    Nexora Mobile
    Live VTUGate Data Plans
    IMPORTANT:
    Your backend must expose:
      GET  /api/data
      POST /api/data/purchase
    The purchase request now includes:
      service_id
      code
      phone
      network
  */
  const API_BASE = "https://nexora-ai-backend-hvg7.onrender.com";
  const networkSelect = document.getElementById("network");
  const planSelect = document.getElementById("plan");
  const phoneInput = document.getElementById("phone");
  const buyButton = document.getElementById("buyButton");
  const statusBox = document.getElementById("status");
  const planInfo = document.getElementById("planInfo");
  const selectedPlanName = document.getElementById("selectedPlanName");
  const selectedPlanPrice = document.getElementById("selectedPlanPrice");
  const successMessage = document.getElementById("successMessage");
  const errorMessage = document.getElementById("errorMessage");
  let allPlans = [];
  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
    successMessage.style.display = "none";
  }
  function showSuccess(message) {
    successMessage.textContent = message;
    successMessage.style.display = "block";
    errorMessage.style.display = "none";
  }
  function clearMessages() {
    successMessage.style.display = "none";
    errorMessage.style.display = "none";
  }
  function money(value) {
    const amount = Number(value);
    if (!Number.isFinite(amount)) {
      return "₦0.00";
    }
    return "₦" + amount.toLocaleString("en-NG", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }
  function normalisePlan(plan) {
    return {
      serviceId:
        plan.serviceId ??
        plan.service_id ??
        plan.serviceID,
      network: String(plan.network || "").toLowerCase(),
      code:
        plan.code ??
        plan.planCode ??
        plan.plan_code,
      name:
        plan.name ??
        plan.planName ??
        plan.plan_name ??
        "Data Plan",
      price:
        Number(
          plan.price ??
          plan.amount ??
          0
        )
    };
  }
  async function loadPlans() {
    try {
      statusBox.textContent = "Loading live data plans...";
      const response = await fetch(API_BASE + "/api/data", {
        method: "GET",
        headers: {
          "Accept": "application/json"
        }
      });
      if (!response.ok) {
        throw new Error("Unable to load data plans.");
      }
      const data = await response.json();
      if (!data.success) {
        throw new Error(
          data.message ||
          data.error ||
          "The data provider returned an error."
        );
      }
      if (!Array.isArray(data.plans)) {
        throw new Error("No plans were returned by the server.");
      }
      allPlans = data.plans
        .map(normalisePlan)
        .filter(plan =>
          plan.serviceId &&
          plan.code &&
          plan.network
        );
      if (allPlans.length === 0) {
        throw new Error("No usable data plans were found.");
      }
      planSelect.disabled = false;
      statusBox.textContent =
        "Live plans loaded: " + allPlans.length;
      updatePlans();
    } catch (error) {
      console.error("LOAD PLANS ERROR:", error);
      statusBox.textContent = "Unable to load live data plans.";
      planSelect.innerHTML =
        '<option value="">No plans available</option>';
      showError(error.message || "Unable to load data plans.");
    }
  }
  function updatePlans() {
    const network = networkSelect.value.toLowerCase();
    planSelect.innerHTML =
      '<option value="">Select Data Plan</option>';
    planInfo.style.display = "none";
    if (!network) {
      buyButton.disabled = true;
      return;
    }
    const filtered = allPlans.filter(plan =>
      plan.network === network
    );
    if (filtered.length === 0) {
      planSelect.innerHTML =
        '<option value="">No plans available</option>';
      buyButton.disabled = true;
      return;
    }
    filtered.forEach((plan, index) => {
      const option = document.createElement("option");
      /*
        We store the COMPLETE plan object in the option.
        This is important because serviceId is required
        when making the purchase.
      */
      option.value = String(index);
      option.textContent =
        plan.name + " — " + money(plan.price);
      option.dataset.serviceId = String(plan.serviceId);
      option.dataset.code = String(plan.code);
      option.dataset.price = String(plan.price);
      option.dataset.name = plan.name;
      option.dataset.network = plan.network;
      planSelect.appendChild(option);
    });
    buyButton.disabled = true;
  }
  function updateSelectedPlan() {
    clearMessages();
    const option =
      planSelect.options[planSelect.selectedIndex];
    if (
      !option ||
      !option.value ||
      !option.dataset.serviceId ||
      !option.dataset.code
    ) {
      planInfo.style.display = "none";
      buyButton.disabled = true;
      return;
    }
    selectedPlanName.textContent =
      option.dataset.name;
    selectedPlanPrice.textContent =
      "Price: " + money(option.dataset.price);
    planInfo.style.display = "block";
    checkForm();
  }
  function checkForm() {
    const phone =
      phoneInput.value.replace(/\D/g, "");
    const option =
      planSelect.options[planSelect.selectedIndex];
    const validPhone =
      /^0\d{10}$/.test(phone);
    const validPlan =
      option &&
      option.value &&
      option.dataset.serviceId &&
      option.dataset.code;
    buyButton.disabled =
      !(validPhone && validPlan);
  }
  networkSelect.addEventListener("change", () => {
    clearMessages();
    updatePlans();
  });
  planSelect.addEventListener("change", () => {
    updateSelectedPlan();
  });
  phoneInput.addEventListener("input", () => {
    phoneInput.value =
      phoneInput.value.replace(/\D/g, "").slice(0, 11);
    checkForm();
  });
  buyButton.addEventListener("click", async () => {
    clearMessages();
    const phone =
      phoneInput.value.replace(/\D/g, "");
    const option =
      planSelect.options[planSelect.selectedIndex];
    if (!/^0\d{10}$/.test(phone)) {
      showError("Enter a valid 11-digit Nigerian phone number.");
      return;
    }
    if (
      !option ||
      !option.dataset.serviceId ||
      !option.dataset.code
    ) {
      showError("Please select a data plan.");
      return;
    }
    /*
      THIS IS THE IMPORTANT FIX.
      service_id is explicitly sent to the backend.
    */
    const serviceId =
      Number(option.dataset.serviceId);
    const code =
      option.dataset.code;
    const network =
      option.dataset.network;
    const price =
      Number(option.dataset.price);
    if (!serviceId) {
      showError("This plan has no service ID.");
      return;
    }
    if (!code) {
      showError("This plan has no plan code.");
      return;
    }
    buyButton.disabled = true;
    buyButton.textContent = "Processing...";
    try {
      const purchaseData = {
        /*
          Send both formats for compatibility.
        */
        service_id: serviceId,
        serviceId: serviceId,
        code: code,
        phone: phone,
        phone_number: phone,
        network: network,
        amount: price
      };
      console.log(
        "Nexora Mobile purchase request:",
        purchaseData
      );
      const response = await fetch(
        API_BASE + "/api/data/purchase",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(purchaseData)
        }
      );
      let result;
      try {
        result = await response.json();
      } catch {
        result = {
          success: false,
          message: "Server returned an invalid response."
        };
      }
      console.log(
        "Nexora Mobile purchase response:",
        result
      );
      if (!response.ok || result.success === false) {
        const serverMessage =
          result.message ||
          result.error ||
          result.details ||
          "Purchase failed.";
        throw new Error(serverMessage);
      }
      showSuccess(
        result.message ||
        "Data purchase successful."
      );
      statusBox.textContent =
        "Data purchase completed.";
    } catch (error) {
      console.error(
        "PURCHASE ERROR:",
        error
      );
      showError(
        error.message ||
        "Purchase failed. Please try again."
      );
    } finally {
      buyButton.disabled = false;
      buyButton.textContent = "Buy Data";
      checkForm();
    }
  });
  loadPlans();
</script>
</body>
</html>
