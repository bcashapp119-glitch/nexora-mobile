<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Mobile - Buy Data</title>
<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}
body{
  margin:0;
  background:#f5f7fb;
  color:#111827;
}
.header{
  background:#08152f;
  color:white;
  padding:20px;
  text-align:center;
}
.header h1{
  margin:0;
  font-size:24px;
}
.container{
  max-width:600px;
  margin:25px auto;
  padding:20px;
}
.wallet,
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}
.wallet{
  margin-bottom:18px;
}
.wallet-title{
  font-size:14px;
  color:#6b7280;
  margin-bottom:5px;
}
.wallet-balance{
  font-size:25px;
  font-weight:bold;
}
label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
}
select,
input{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}
button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.status{
  text-align:center;
  margin:15px 0;
  font-size:14px;
  color:#4b5563;
}
.plan-info{
  margin-top:12px;
  padding:14px;
  border-radius:10px;
  background:#eef4ff;
  display:none;
}
.plan-info strong{
  display:block;
  margin-bottom:6px;
}
.badge{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
  font-weight:bold;
}
.message{
  display:none;
  padding:14px;
  margin-top:15px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}
.success{
  background:#dcfce7;
  color:#166534;
}
.error{
  background:#fee2e2;
  color:#991b1b;
}
.footer{
  text-align:center;
  color:#6b7280;
  font-size:13px;
  margin-top:25px;
}
</style>
</head>
<body>
<div class="header">
  <h1>Buy Data</h1>
</div>
<div class="container">
  <div class="wallet">
    <div class="wallet-title">Wallet Balance</div>
    <div class="wallet-balance" id="walletBalance">
      ₦1,500.00
    </div>
  </div>
  <div class="card">
<label for="network">
  Network
</label>
<select id="network">
  <option value="">Select Network</option>
  <option value="mtn">MTN</option>
  <option value="glo">Glo</option>
  <option value="airtel">Airtel</option>
  <option value="9mobile">9mobile</option>
</select>
<label for="dataType">
  Data Type
</label>
<select id="dataType" disabled>
  <option value="">
    Select Data Type
  </option>
</select>
<label for="plan">
  Data Plan
</label>
<select id="plan" disabled>
  <option value="">
    Select Data Plan
  </option>
</select>
<div class="plan-info" id="planInfo">
  <strong id="selectedPlanName"></strong>
  <span id="selectedPlanPrice"></span>
  <div
    class="badge"
    id="selectedDataType">
  </div>
</div>
<label for="phone">
  Phone Number
</label>
<input
  type="tel"
  id="phone"
  placeholder="08012345678"
  maxlength="11"
  inputmode="numeric"
>
<button
  id="buyButton"
  disabled>
  Buy Data
</button>
<div
  class="status"
  id="status">
  Loading live VTUGate data plans...
</div>
<div
  class="message success"
  id="successMessage">
</div>
<div
  class="message error"
  id="errorMessage">
</div>
  </div>
  <div class="footer">
    Nexora Mobile • Powered by VTUGate
  </div>
</div>
<script>
const API_BASE =
  "https://nexora-ai-backend-hvg7.onrender.com";
const networkSelect =
  document.getElementById("network");
const dataTypeSelect =
  document.getElementById("dataType");
const planSelect =
  document.getElementById("plan");
const phoneInput =
  document.getElementById("phone");
const buyButton =
  document.getElementById("buyButton");
const statusBox =
  document.getElementById("status");
const planInfo =
  document.getElementById("planInfo");
const selectedPlanName =
  document.getElementById("selectedPlanName");
const selectedPlanPrice =
  document.getElementById("selectedPlanPrice");
const selectedDataType =
  document.getElementById("selectedDataType");
const successMessage =
  document.getElementById("successMessage");
const errorMessage =
  document.getElementById("errorMessage");
let allPlans = [];
let filteredPlans = [];
/* =========================
   MESSAGES
========================= */
function showError(message){
  errorMessage.textContent = message;
  errorMessage.style.display = "block";
  successMessage.style.display = "none";
}
function showSuccess(message){
  successMessage.textContent = message;
  successMessage.style.display = "block";
  errorMessage.style.display = "none";
}
function clearMessages(){
  successMessage.style.display = "none";
  errorMessage.style.display = "none";
}
/* =========================
   MONEY
========================= */
function money(value){
  const amount = Number(value);
  if(!Number.isFinite(amount)){
    return "₦0.00";
  }
  return "₦" +
    amount.toLocaleString(
      "en-NG",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}
/* =========================
   NORMALISE PLAN
========================= */
function normalisePlan(plan){
  return {
    serviceId:
      plan.serviceId ??
      plan.service_id ??
      plan.serviceID,
    network:
      String(
        plan.network ??
        plan.network_name ??
        ""
      ).toLowerCase(),
    dataType:
      String(
        plan.dataType ??
        plan.data_type ??
        plan.plan_type ??
        "normal"
      ).toLowerCase(),
    code:
      plan.code ??
      plan.planCode ??
      plan.plan_code,
    name:
      plan.name ??
      plan.planName ??
      plan.plan_name ??
      "Data Plan",
    price:
      Number(
        plan.price ??
        plan.amount ??
        0
      )
  };
}
/* =========================
   LOAD LIVE PLANS
========================= */
async function loadPlans(){
  try{
    statusBox.textContent =
      "Loading live VTUGate data plans...";
    const response =
      await fetch(
        API_BASE + "/api/data",
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );
    if(!response.ok){
      throw new Error(
        "Unable to load live data plans."
      );
    }
    const data =
      await response.json();
    if(!data.success){
      throw new Error(
        data.message ||
        "VTUGate returned an error."
      );
    }
    if(!Array.isArray(data.plans)){
      throw new Error(
        "No data plans were returned."
      );
    }
    allPlans =
      data.plans
        .map(normalisePlan)
        .filter(plan =>
          plan.serviceId &&
          plan.code &&
          plan.network &&
          plan.dataType
        );
    if(allPlans.length === 0){
      throw new Error(
        "No usable VTUGate data plans were found."
      );
    }
    statusBox.textContent =
      "Live plans loaded: " +
      allPlans.length;
  }
  catch(error){
    console.error(
      "LOAD PLANS ERROR:",
      error
    );
    statusBox.textContent =
      "Unable to load live data plans.";
    showError(
      error.message ||
      "Unable to load data plans."
    );
  }
}
/* =========================
   UPDATE DATA TYPES
========================= */
function updateDataTypes(){
  clearMessages();
  const network =
    networkSelect.value.toLowerCase();
  dataTypeSelect.innerHTML =
    '<option value="">Select Data Type</option>';
  planSelect.innerHTML =
    '<option value="">Select Data Plan</option>';
  dataTypeSelect.disabled = true;
  planSelect.disabled = true;
  planInfo.style.display = "none";
  buyButton.disabled = true;
  if(!network){
    return;
  }
  const networkPlans =
    allPlans.filter(
      plan =>
        plan.network === network
    );
  if(networkPlans.length === 0){
    dataTypeSelect.innerHTML =
      '<option value="">No data types available</option>';
    return;
  }
  const types =
    [
      ...new Set(
        networkPlans.map(
          plan => plan.dataType
        )
      )
    ];
  const typeOrder = [
    "sme",
    "dg",
    "awoof",
    "normal"
  ];
  types.sort((a,b) => {
    const ai =
      typeOrder.indexOf(a);
    const bi =
      typeOrder.indexOf(b);
    if(ai === -1 && bi === -1){
      return a.localeCompare(b);
    }
    if(ai === -1){
      return 1;
    }
    if(bi === -1){
      return -1;
    }
    return ai - bi;
  });
  types.forEach(type => {
    const option =
      document.createElement("option");
    option.value = type;
    option.textContent =
      type.toUpperCase();
    dataTypeSelect.appendChild(option);
  });
  dataTypeSelect.disabled = false;
}
/* =========================
   UPDATE PLANS
========================= */
function updatePlans(){
  clearMessages();
  const network =
    networkSelect.value.toLowerCase();
  const dataType =
    dataTypeSelect.value.toLowerCase();
  planSelect.innerHTML =
    '<option value="">Select Data Plan</option>';
  planSelect.disabled = true;
  planInfo.style.display = "none";
  buyButton.disabled = true;
  if(!network || !dataType){
    return;
  }
  filteredPlans =
    allPlans.filter(
      plan =>
        plan.network === network &&
        plan.dataType === dataType
    );
  if(filteredPlans.length === 0){
    planSelect.innerHTML =
      '<option value="">No plans available</option>';
    return;
  }
  filteredPlans.forEach(
    (plan,index) => {
      const option =
        document.createElement("option");
      option.value =
        String(index);
      option.textContent =
        plan.name +
        " — " +
        money(plan.price);
      option.dataset.serviceId =
        String(plan.serviceId);
      option.dataset.planCode =
        String(plan.code);
      option.dataset.price =
        String(plan.price);
      option.dataset.name =
        plan.name;
      option.dataset.network =
        plan.network;
      option.dataset.dataType =
        plan.dataType;
      planSelect.appendChild(option);
    }
  );
  planSelect.disabled = false;
}
/* =========================
   SELECT PLAN
========================= */
function updateSelectedPlan(){
  clearMessages();
  const option =
    planSelect.options[
      planSelect.selectedIndex
    ];
  if(
    !option ||
    !option.value ||
    !option.dataset.serviceId ||
    !option.dataset.planCode
  ){
    planInfo.style.display =
      "none";
    buyButton.disabled =
      true;
    return;
  }
  selectedPlanName.textContent =
    option.dataset.name;
  selectedPlanPrice.textContent =
    "Price: " +
    money(
      option.dataset.price
    );
  selectedDataType.textContent =
    option.dataset.dataType.toUpperCase();
  planInfo.style.display =
    "block";
  checkForm();
}
/* =========================
   CHECK FORM
========================= */
function checkForm(){
  const phone =
    phoneInput.value
      .replace(/\D/g,"");
  const option =
    planSelect.options[
      planSelect.selectedIndex
    ];
  const validPhone =
    /^0\d{10}$/.test(phone);
  const validPlan =
    option &&
    option.value &&
    option.dataset.serviceId &&
    option.dataset.planCode;
  buyButton.disabled =
    !(validPhone && validPlan);
}
/* =========================
   NETWORK CHANGE
========================= */
networkSelect.addEventListener(
  "change",
  updateDataTypes
);
/* =========================
   DATA TYPE CHANGE
========================= */
dataTypeSelect.addEventListener(
  "change",
  updatePlans
);
/* =========================
   PLAN CHANGE
========================= */
planSelect.addEventListener(
  "change",
  updateSelectedPlan
);
/* =========================
   PHONE INPUT
========================= */
phoneInput.addEventListener(
  "input",
  () => {
    phoneInput.value =
      phoneInput.value
        .replace(/\D/g,"")
        .slice(0,11);
    checkForm();
  }
);
/* =========================
   BUY DATA
========================= */
buyButton.addEventListener(
  "click",
  async () => {
    clearMessages();
    const phone =
      phoneInput.value
        .replace(/\D/g,"");
    const option =
      planSelect.options[
        planSelect.selectedIndex
      ];
    if(!/^0\d{10}$/.test(phone)){
      showError(
        "Enter a valid 11-digit Nigerian phone number."
      );
      return;
    }
    if(
      !option ||
      !option.dataset.serviceId ||
      !option.dataset.planCode
    ){
      showError(
        "Please select a data plan."
      );
      return;
    }
    const serviceId =
      Number(
        option.dataset.serviceId
      );
    const planCode =
      option.dataset.planCode;
    const amount =
      Number(
        option.dataset.price
      );
    if(!serviceId){
      showError(
        "This plan has no service ID."
      );
      return;
    }
    if(!planCode){
      showError(
        "This plan has no plan code."
      );
      return;
    }
    if(
      !Number.isFinite(amount) ||
      amount <= 0
    ){
      showError(
        "Invalid data plan price."
      );
      return;
    }
    buyButton.disabled = true;
    buyButton.textContent =
      "Processing...";
    try{
      const purchaseData = {
        service_id:
          serviceId,
        phone_number:
          phone,
        amount:
          amount,
        plan_code:
          planCode
      };
      console.log(
        "Nexora Mobile purchase:",
        purchaseData
      );
      const response =
        await fetch(
          API_BASE +
          "/api/data/purchase",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json",
              "Accept":
                "application/json"
            },
            body:
              JSON.stringify(
                purchaseData
              )
          }
        );
      let result;
      try{
        result =
          await response.json();
      }
      catch{
        result = {
          success:false,
          message:
            "Server returned an invalid response."
        };
      }
      console.log(
        "Purchase response:",
        result
      );
      if(
        !response.ok ||
        result.success === false
      ){
        throw new Error(
          result.message ||
          result.error ||
          "Data purchase failed."
        );
      }
      showSuccess(
        result.message ||
        "Data purchase successful."
      );
      statusBox.textContent =
        "Data purchase completed successfully.";
    }
    catch(error){
      console.error(
        "PURCHASE ERROR:",
        error
      );
      showError(
        error.message ||
        "Purchase failed. Please try again."
      );
    }
    finally{
      buyButton.disabled =
        false;
      buyButton.textContent =
        "Buy Data";
      checkForm();
    }
  }
);
/* =========================
   START
========================= */
loadPlans();
</script>
</body>
</html>
