<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Mobile - Buy Data</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f5f7fb;
      color: #111827;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .wallet {
      background: #111827;
      color: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }
    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      display: none;
    }
    .footer {
      text-align: center;
      margin-top: 25px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Buy Data</h1>
  <div class="wallet">
    Wallet Balance: ₦1,500.00
  </div>
  <div class="card">
    <label for="network">Network</label>
    <select id="network">
      <option value="">Select Network</option>
      <option value="mtn">MTN</option>
      <option value="glo">Glo</option>
      <option value="airtel">Airtel</option>
      <option value="9mobile">9mobile</option>
    </select>
    <label for="plan">Data Plan</label>
    <select id="plan" disabled>
      <option value="">Loading live data plans...</option>
    </select>
    <label for="phone">Phone Number</label>
    <input
      id="phone"
      type="tel"
      placeholder="Enter phone number"
      maxlength="11"
    >
    <button id="buyBtn">
      Buy Data
    </button>
    <div id="status" class="status"></div>
  </div>
  <div class="footer">
    Nexora Mobile • Powered by VTUGate
  </div>
</div>
<script>
  const BACKEND_URL = "https://nexora-ai-backend-hvg7.onrender.com";
  const networkSelect = document.getElementById("network");
  const planSelect = document.getElementById("plan");
  const phoneInput = document.getElementById("phone");
  const buyBtn = document.getElementById("buyBtn");
  const statusBox = document.getElementById("status");
  let allPlans = [];
  function showStatus(message) {
    statusBox.style.display = "block";
    statusBox.textContent = message;
  }
  async function loadPlans() {
    try {
      planSelect.disabled = true;
      planSelect.innerHTML =
        '<option value="">Loading live data plans...</option>';
      const response = await fetch(
        BACKEND_URL + "/api/vtu/data-plans"
      );
      if (!response.ok) {
        throw new Error("Server returned " + response.status);
      }
      const data = await response.json();
      console.log("VTUGate response:", data);
      if (!data.success || !Array.isArray(data.plans)) {
        throw new Error("Invalid plans response");
      }
      allPlans = data.plans;
      planSelect.innerHTML =
        '<option value="">Select Data Plan</option>';
      planSelect.disabled = true;
      showStatus(
        "Live plans loaded: " + allPlans.length
      );
    } catch (error) {
      console.error(error);
      planSelect.innerHTML =
        '<option value="">Unable to load live data plans</option>';
      planSelect.disabled = true;
      showStatus(
        "Could not load live data plans. Please refresh and try again."
      );
    }
  }
  networkSelect.addEventListener("change", function () {
    const network = this.value;
    planSelect.innerHTML =
      '<option value="">Select Data Plan</option>';
    if (!network) {
      planSelect.disabled = true;
      return;
    }
    const networkPlans = allPlans.filter(
      plan =>
        String(plan.network).toLowerCase() ===
        network.toLowerCase()
    );
    if (networkPlans.length === 0) {
      planSelect.innerHTML =
        '<option value="">No plans available</option>';
      planSelect.disabled = true;
      return;
    }
    networkPlans.forEach((plan, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent =
        plan.name +
        " — ₦" +
        Number(plan.price).toLocaleString("en-NG", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      option.dataset.serviceId = plan.serviceId;
      option.dataset.code = plan.code;
      option.dataset.price = plan.price;
      option.dataset.name = plan.name;
      option.dataset.network = plan.network;
      planSelect.appendChild(option);
    });
    planSelect.disabled = false;
    showStatus(
      networkPlans.length +
      " " +
      network.toUpperCase() +
      " plans available."
    );
  });
  buyBtn.addEventListener("click", async function () {
    const network = networkSelect.value;
    const selectedOption =
      planSelect.options[planSelect.selectedIndex];
    const phone = phoneInput.value.trim();
    if (!network) {
      alert("Please select a network.");
      return;
    }
    if (!selectedOption || !selectedOption.dataset.serviceId) {
      alert("Please select a data plan.");
      return;
    }
    if (!/^[0-9]{11}$/.test(phone)) {
      alert("Please enter a valid 11-digit Nigerian phone number.");
      return;
    }
    const serviceId = selectedOption.dataset.serviceId;
    const code = selectedOption.dataset.code;
    const price = selectedOption.dataset.price;
    const planName = selectedOption.dataset.name;
    const confirmPurchase = confirm(
      "Confirm Data Purchase\n\n" +
      "Network: " + network.toUpperCase() + "\n" +
      "Plan: " + planName + "\n" +
      "Phone: " + phone + "\n" +
      "Price: ₦" +
      Number(price).toLocaleString("en-NG")
    );
    if (!confirmPurchase) {
      return;
    }
    buyBtn.disabled = true;
    buyBtn.textContent = "Processing...";
    try {
      /*
       * Purchase endpoint.
       * Your backend must expose this route for the actual purchase.
       */
      const response = await fetch(
        BACKEND_URL + "/api/vtu/buy-data",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            serviceId: Number(serviceId),
            code: code,
            phone: phone,
            network: network,
            amount: Number(price),
            planName: planName
          })
        }
      );
      const result = await response.json();
      console.log("Purchase response:", result);
      if (!response.ok || result.success === false) {
        throw new Error(
          result.message || "Data purchase failed"
        );
      }
      alert(
        "Data purchase successful!\n\n" +
        planName +
        "\n" +
        "Phone: " +
        phone
      );
      showStatus("Data purchase successful.");
    } catch (error) {
      console.error(error);
      alert(
        "Purchase could not be completed.\n\n" +
        error.message
      );
      showStatus(
        "Purchase failed. Please try again."
      );
    } finally {
      buyBtn.disabled = false;
      buyBtn.textContent = "Buy Data";
    }
  });
  loadPlans();
</script>
</body>
</html>
