<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Data</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f3f6fb;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#2563eb;
}

input,select{
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

</style>

</head>


<body>


<div class="container">

<h1>Buy Data</h1>


<select id="network">
<option>MTN</option>
<option>Airtel</option>
<option>Glo</option>
<option>9mobile</option>
</select>


<select id="plan">

<option value="500">1GB - ₦500</option>

<option value="1000">2GB - ₦1000</option>

<option value="2000">5GB - ₦2000</option>

<option value="5000">10GB - ₦5000</option>

</select>


<input id="phone" placeholder="Phone Number">


<button id="buy">
Buy Data
</button>


<p id="message"></p>


</div>



<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
updateDoc,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



const firebaseConfig = {

apiKey:"AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",

authDomain:"nexora-mobile-af02f.firebaseapp.com",

projectId:"nexora-mobile-af02f",

storageBucket:"nexora-mobile-af02f.firebasestorage.app",

messagingSenderId:"498265618137",

appId:"1:498265618137:web:a1ffebae8eda0b88abf0c8",

measurementId:"G-8494CNWZKL"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


let user = null;


onAuthStateChanged(auth,(currentUser)=>{

user=currentUser;

});



document.getElementById("buy").onclick = async()=>{


if(!user){

document.getElementById("message").innerHTML =
"Please login first";

return;

}



let network =
document.getElementById("network").value;


let phone =
document.getElementById("phone").value;


let amount =
Number(document.getElementById("plan").value);



if(!phone || amount <= 0){

document.getElementById("message").innerHTML =
"Fill all fields";

return;

}



const userRef = doc(
db,
"users",
user.uid
);



const userSnap = await getDoc(userRef);


let wallet =
userSnap.data().wallet || 0;



if(wallet < amount){

document.getElementById("message").innerHTML =
"Insufficient wallet balance";

return;

}



await updateDoc(userRef,{

wallet: wallet - amount

});



await addDoc(collection(db,"transactions"),{

userId:user.uid,

type:"Data Purchase",

network:network,

phone:phone,

amount:amount,

status:"Successful",

createdAt:serverTimestamp()

});



document.getElementById("message").innerHTML =
"Data purchase successful";


};


</script>


</body>

</html>
