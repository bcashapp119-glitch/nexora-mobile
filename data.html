<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Mobile - Buy Data</title>
<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}
body{
  margin:0;
  background:#f5f7fb;
  color:#111827;
}
.header{
  background:#08152f;
  color:white;
  padding:20px;
  text-align:center;
}
.header h1{
  margin:0;
  font-size:24px;
}
.container{
  max-width:600px;
  margin:25px auto;
  padding:20px;
}
.wallet,
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}
.wallet{
  margin-bottom:18px;
}
.wallet-title{
  color:#6b7280;
  font-size:14px;
  margin-bottom:5px;
}
.wallet-balance{
  font-size:25px;
  font-weight:bold;
}
label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
}
select,
input{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}
select:disabled{
  background:#f3f4f6;
  color:#6b7280;
}
button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.plan-info{
  display:none;
  margin-top:12px;
  padding:14px;
  border-radius:10px;
  background:#eef4ff;
}
.plan-info strong{
  display:block;
  margin-bottom:6px;
}
.badge{
  display:inline-block;
  margin-top:8px;
  padding:5px 10px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
  font-weight:bold;
}
.status{
  text-align:center;
  margin:15px 0;
  color:#4b5563;
  font-size:14px;
}
.message{
  display:none;
  padding:14px;
  margin-top:15px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}
.success{
  background:#dcfce7;
  color:#166534;
}
.error{
  background:#fee2e2;
  color:#991b1b;
}
.footer{
  text-align:center;
  color:#6b7280;
  font-size:13px;
  margin-top:25px;
}
</style>
</head>
<body>
<div class="header">
  <h1>Nexora Mobile</h1>
</div>
<div class="container">
  <div class="wallet">
    <div class="wallet-title">Wallet Balance</div>
    <div class="wallet-balance" id="walletBalance">
      ₦1,500.00
    </div>
  </div>
  <div class="card">
    <!-- NETWORK -->
    <label for="network">Network</label>
    <select id="network">
      <option value="">Select Network</option>
      <option value="mtn">MTN</option>
      <option value="glo">Glo</option>
      <option value="airtel">Airtel</option>
      <option value="9mobile">9mobile</option>
    </select>
    <!-- DATA TYPE -->
    <label for="dataType">Data Type</label>
    <select id="dataType" disabled>
      <option value="">Select Data Type</option>
    </select>
    <!-- DATA PLAN -->
    <label for="plan">Data Plan</label>
    <select id="plan" disabled>
      <option value="">Select Data Plan</option>
    </select>
    <!-- PLAN INFORMATION -->
    <div class="plan-info" id="planInfo">
      <strong id="selectedPlanName"></strong>
      <span id="selectedPlanPrice"></span>
      <br>
      <span
        class="badge"
        id="selectedDataType">
      </span>
    </div>
    <!-- PHONE -->
    <label for="phone">Phone Number</label>
    <input
      id="phone"
      type="tel"
      maxlength="11"
      inputmode="numeric"
      placeholder="08012345678"
    >
    <!-- BUY -->
    <button id="buyButton" disabled>
      Buy Data
    </button>
    <div class="status" id="status">
      Loading live data plans...
    </div>
    <div
      class="message success"
      id="successMessage">
    </div>
    <div
      class="message error"
      id="errorMessage">
    </div>
  </div>
  <div class="footer">
    Nexora Mobile • Powered by VTUGate
  </div>
</div>
<script>
const API_BASE =
  "https://nexora-ai-backend-hvg7.onrender.com";
const networkSelect =
  document.getElementById("network");
const dataTypeSelect =
  document.getElementById("dataType");
const planSelect =
  document.getElementById("plan");
const phoneInput =
  document.getElementById("phone");
const buyButton =
  document.getElementById("buyButton");
const statusBox =
  document.getElementById("status");
const planInfo =
  document.getElementById("planInfo");
const selectedPlanName =
  document.getElementById("selectedPlanName");
const selectedPlanPrice =
  document.getElementById("selectedPlanPrice");
const selectedDataType =
  document.getElementById("selectedDataType");
const successMessage =
  document.getElementById("successMessage");
const errorMessage =
  document.getElementById("errorMessage");
let allPlans = [];
/* =====================================================
   MONEY
===================================================== */
function money(value){
  const amount = Number(value);
  if(!Number.isFinite(amount)){
    return "₦0.00";
  }
  return "₦" + amount.toLocaleString(
    "en-NG",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}
/* =====================================================
   MESSAGES
===================================================== */
function showError(message){
  errorMessage.textContent =
    message || "Something went wrong.";
  errorMessage.style.display =
    "block";
  successMessage.style.display =
    "none";
}
function showSuccess(message){
  successMessage.textContent =
    message || "Successful.";
  successMessage.style.display =
    "block";
  errorMessage.style.display =
    "none";
}
function clearMessages(){
  errorMessage.style.display =
    "none";
  successMessage.style.display =
    "none";
}
/* =====================================================
   NORMALISE DATA TYPE
===================================================== */
function normaliseDataType(value){
  let type =
    String(value || "")
      .trim()
      .toLowerCase();
  /*
    Keep VTUGate's actual types.
  */
  if(type === "sme"){
    return "sme";
  }
  if(type === "dg"){
    return "dg";
  }
  if(type === "awoof"){
    return "awoof";
  }
  if(type === "normal"){
    return "normal";
  }
  return type;
}
/* =====================================================
   NORMALISE PLAN
===================================================== */
function normalisePlan(plan){
  return {
    serviceId:
      Number(
        plan.serviceId ??
        plan.service_id ??
        plan.serviceID ??
        0
      ),
    network:
      String(
        plan.network ??
        plan.network_name ??
        ""
      )
      .trim()
      .toLowerCase(),
    dataType:
      normaliseDataType(
        plan.dataType ??
        plan.data_type ??
        plan.plan_type ??
        "normal"
      ),
    code:
      String(
        plan.code ??
        plan.planCode ??
        plan.plan_code ??
        ""
      ),
    name:
      String(
        plan.name ??
        plan.planName ??
        plan.plan_name ??
        "Data Plan"
      ),
    price:
      Number(
        plan.price ??
        plan.amount ??
        0
      )
  };
}
/* =====================================================
   DATA TYPE DISPLAY NAME
===================================================== */
function dataTypeName(type){
  const names = {
    sme: "SME",
    dg: "DG",
    awoof: "Awoof",
    normal: "Normal"
  };
  return (
    names[type] ||
    type.toUpperCase()
  );
}
/* =====================================================
   RESET DATA TYPE
===================================================== */
function resetDataType(){
  dataTypeSelect.innerHTML =
    '<option value="">Select Data Type</option>';
  dataTypeSelect.disabled =
    true;
}
/* =====================================================
   RESET DATA PLAN
===================================================== */
function resetPlan(){
  planSelect.innerHTML =
    '<option value="">Select Data Plan</option>';
  planSelect.disabled =
    true;
  planInfo.style.display =
    "none";
  buyButton.disabled =
    true;
}
/* =====================================================
   LOAD LIVE VTUGATE PLANS
===================================================== */
async function loadPlans(){
  try{
    statusBox.textContent =
      "Connecting to VTUGate...";
    const response =
      await fetch(
        API_BASE + "/api/data",
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );
    if(!response.ok){
      throw new Error(
        "Backend returned HTTP " +
        response.status
      );
    }
    const result =
      await response.json();
    if(
      !result ||
      result.success !== true
    ){
      throw new Error(
        result?.message ||
        "VTUGate returned an error."
      );
    }
    if(
      !Array.isArray(result.plans)
    ){
      throw new Error(
        "VTUGate did not return data plans."
      );
    }
    allPlans =
      result.plans
        .map(normalisePlan)
        .filter(plan =>
          plan.serviceId > 0 &&
          plan.code !== "" &&
          plan.network !== "" &&
          plan.dataType !== "" &&
          Number.isFinite(plan.price)
        );
    if(allPlans.length === 0){
      throw new Error(
        "No usable VTUGate plans were found."
      );
    }
    statusBox.textContent =
      "Live plans loaded: " +
      allPlans.length;
    resetDataType();
    resetPlan();
  }
  catch(error){
    console.error(
      "LOAD PLANS ERROR:",
      error
    );
    statusBox.textContent =
      "Unable to load live plans.";
    showError(
      error.message ||
      "Unable to load data plans."
    );
  }
}
/* =====================================================
   NETWORK SELECTED
===================================================== */
networkSelect.addEventListener(
  "change",
  function(){
    clearMessages();
    resetDataType();
    resetPlan();
    const selectedNetwork =
      networkSelect.value
        .trim()
        .toLowerCase();
    if(!selectedNetwork){
      statusBox.textContent =
        "Select a network.";
      return;
    }
    const networkPlans =
      allPlans.filter(
        plan =>
          plan.network ===
          selectedNetwork
      );
    if(networkPlans.length === 0){
      statusBox.textContent =
        "No plans available for " +
        selectedNetwork.toUpperCase();
      dataTypeSelect.innerHTML =
        '<option value="">No data types available</option>';
      return;
    }
    /*
      Get unique types belonging ONLY
      to the selected network.
    */
    const types =
      [
        ...new Set(
          networkPlans
            .map(
              plan =>
                plan.dataType
            )
            .filter(Boolean)
        )
      ];
    /*
      Put common VTUGate types first.
    */
    const preferredOrder = [
      "sme",
      "dg",
      "awoof",
      "normal"
    ];
    types.sort(
      (a,b) => {
        const aIndex =
          preferredOrder.indexOf(a);
        const bIndex =
          preferredOrder.indexOf(b);
        if(
          aIndex === -1 &&
          bIndex === -1
        ){
          return a.localeCompare(b);
        }
        if(aIndex === -1){
          return 1;
        }
        if(bIndex === -1){
          return -1;
        }
        return aIndex - bIndex;
      }
    );
    types.forEach(
      type => {
        const option =
          document.createElement(
            "option"
          );
        option.value =
          type;
        option.textContent =
          dataTypeName(type);
        dataTypeSelect.appendChild(
          option
        );
      }
    );
    dataTypeSelect.disabled =
      false;
    statusBox.textContent =
      "Select a data type.";
  }
);
/* =====================================================
   DATA TYPE SELECTED
===================================================== */
dataTypeSelect.addEventListener(
  "change",
  function(){
    clearMessages();
    resetPlan();
    const selectedNetwork =
      networkSelect.value
        .trim()
        .toLowerCase();
    const selectedType =
      dataTypeSelect.value
        .trim()
        .toLowerCase();
    if(
      !selectedNetwork ||
      !selectedType
    ){
      statusBox.textContent =
        "Select a data type.";
      return;
    }
    /*
      THIS IS THE IMPORTANT PART:
      The plan must match BOTH:
      1. Network
      2. Data Type
    */
    const matchingPlans =
      allPlans.filter(
        plan =>
          plan.network ===
            selectedNetwork &&
          plan.dataType ===
            selectedType
      );
    console.log(
      "Selected network:",
      selectedNetwork
    );
    console.log(
      "Selected data type:",
      selectedType
    );
    console.log(
      "Matching plans:",
      matchingPlans
    );
    if(
      matchingPlans.length === 0
    ){
      planSelect.innerHTML =
        '<option value="">No plans available for this type</option>';
      statusBox.textContent =
        "No plans found for " +
        dataTypeName(selectedType);
      return;
    }
    matchingPlans.forEach(
      (dataPlan,index) => {
        const option =
          document.createElement(
            "option"
          );
        option.value =
          String(index);
        option.textContent =
          dataPlan.name +
          " — " +
          money(dataPlan.price);
        /*
          These values are required
          by the existing VTUGate
          purchase endpoint.
        */
        option.dataset.serviceId =
          String(
            dataPlan.serviceId
          );
        option.dataset.planCode =
          dataPlan.code;
        option.dataset.price =
          String(
            dataPlan.price
          );
        option.dataset.name =
          dataPlan.name;
        option.dataset.network =
          dataPlan.network;
        option.dataset.type =
          dataPlan.dataType;
        planSelect.appendChild(
          option
        );
      }
    );
    planSelect.disabled =
      false;
    statusBox.textContent =
      matchingPlans.length +
      " live " +
      dataTypeName(selectedType) +
      " plans available.";
  }
);
/* =====================================================
   PLAN SELECTED
===================================================== */
planSelect.addEventListener(
  "change",
  function(){
    clearMessages();
    const option =
      planSelect.options[
        planSelect.selectedIndex
      ];
    if(
      !option ||
      option.value === "" ||
      !option.dataset.serviceId ||
      !option.dataset.planCode
    ){
      planInfo.style.display =
        "none";
      buyButton.disabled =
        true;
      return;
    }
    selectedPlanName.textContent =
      option.dataset.name;
    selectedPlanPrice.textContent =
      "Price: " +
      money(
        option.dataset.price
      );
    selectedDataType.textContent =
      dataTypeName(
        option.dataset.type
      );
    planInfo.style.display =
      "block";
    checkForm();
  }
);
/* =====================================================
   PHONE INPUT
===================================================== */
phoneInput.addEventListener(
  "input",
  function(){
    phoneInput.value =
      phoneInput.value
        .replace(/\D/g,"")
        .slice(0,11);
    checkForm();
  }
);
/* =====================================================
   CHECK FORM
===================================================== */
function checkForm(){
  const validPhone =
    /^0\d{10}$/.test(
      phoneInput.value
    );
  const option =
    planSelect.options[
      planSelect.selectedIndex
    ];
  const validPlan =
    option &&
    option.value !== "" &&
    option.dataset.serviceId &&
    option.dataset.planCode &&
    Number(
      option.dataset.price
    ) > 0;
  buyButton.disabled =
    !(
      validPhone &&
      validPlan
    );
}
/* =====================================================
   BUY DATA
===================================================== */
buyButton.addEventListener(
  "click",
  async function(){
    clearMessages();
    const option =
      planSelect.options[
        planSelect.selectedIndex
      ];
    if(
      !option ||
      !option.dataset.serviceId ||
      !option.dataset.planCode
    ){
      showError(
        "Please select a data plan."
      );
      return;
    }
    const customerPhone =
      phoneInput.value
        .replace(/\D/g,"");
    if(
      !/^0\d{10}$/.test(
        customerPhone
      )
    ){
      showError(
        "Enter a valid 11-digit Nigerian phone number."
      );
      return;
    }
    const serviceId =
      Number(
        option.dataset.serviceId
      );
    const planCode =
      option.dataset.planCode;
    const amount =
      Number(
        option.dataset.price
      );
    if(!serviceId){
      showError(
        "Invalid VTUGate service ID."
      );
      return;
    }
    if(!planCode){
      showError(
        "Invalid VTUGate plan code."
      );
      return;
    }
    if(
      !Number.isFinite(amount) ||
      amount <= 0
    ){
      showError(
        "Invalid data plan price."
      );
      return;
    }
    buyButton.disabled =
      true;
    buyButton.textContent =
      "Processing...";
    try{
      /*
        KEEPING YOUR CURRENT
        VTUGATE PURCHASE SYSTEM.
        Nothing here changes the
        working backend endpoint.
      */
      const purchaseData = {
        service_id:
          serviceId,
        phone_number:
          customerPhone,
        amount:
          amount,
        plan_code:
          planCode
      };
      console.log(
        "Nexora purchase:",
        purchaseData
      );
      const response =
        await fetch(
          API_BASE +
          "/api/data/purchase",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json",
              "Accept":
                "application/json"
            },
            body:
              JSON.stringify(
                purchaseData
              )
          }
        );
      let result;
      try{
        result =
          await response.json();
      }
      catch{
        throw new Error(
          "Server returned an invalid response."
        );
      }
      console.log(
        "Purchase response:",
        result
      );
      if(
        !response.ok ||
        result.success === false
      ){
        throw new Error(
          result.message ||
          result.error ||
          "Data purchase failed."
        );
      }
      showSuccess(
        result.message ||
        "Data purchase successful."
      );
      statusBox.textContent =
        "Data purchase completed successfully.";
    }
    catch(error){
      console.error(
        "PURCHASE ERROR:",
        error
      );
      showError(
        error.message ||
        "Purchase failed."
      );
    }
    finally{
      buyButton.textContent =
        "Buy Data";
      checkForm();
    }
  }
);
/* =====================================================
   START
===================================================== */
loadPlans();
</script>
</body>
</html>
