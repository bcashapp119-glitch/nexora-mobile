<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Mobile - Buy Data</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#111827;
}

.header{
  background:#08152f;
  color:white;
  padding:20px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:24px;
}

.container{
  max-width:600px;
  margin:25px auto;
  padding:20px;
}

.wallet,
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.wallet{
  margin-bottom:18px;
}

.wallet-title{
  color:#6b7280;
  font-size:14px;
  margin-bottom:5px;
}

.wallet-balance{
  font-size:25px;
  font-weight:bold;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
}

select,
input{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}

select:disabled{
  background:#f3f4f6;
  color:#6b7280;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
}

.plan-info{
  display:none;
  margin-top:12px;
  padding:14px;
  border-radius:10px;
  background:#eef4ff;
}

.plan-info strong{
  display:block;
  margin-bottom:6px;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:5px 10px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
  font-weight:bold;
}

.status{
  text-align:center;
  margin:15px 0;
  color:#4b5563;
  font-size:14px;
}

.message{
  display:none;
  padding:14px;
  margin-top:15px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.footer{
  text-align:center;
  color:#6b7280;
  font-size:13px;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="header">
  <h1>Buy Data</h1>
</div>

<div class="container">

  <div class="wallet">
    <div class="wallet-title">Wallet Balance</div>
    <div class="wallet-balance">₦1,500.00</div>
  </div>

  <div class="card">

    <label>Network</label>

    <select id="network">
      <option value="">Select Network</option>
      <option value="mtn">MTN</option>
      <option value="glo">Glo</option>
      <option value="airtel">Airtel</option>
      <option value="9mobile">9mobile</option>
    </select>


    <label>Data Type</label>

    <select id="dataType" disabled>
      <option value="">Select Data Type</option>
    </select>


    <label>Data Plan</label>

    <select id="plan" disabled>
      <option value="">Select Data Plan</option>
    </select>


    <div class="plan-info" id="planInfo">

      <strong id="selectedPlanName"></strong>

      <span id="selectedPlanPrice"></span>

      <br>

      <span
        class="badge"
        id="selectedDataType">
      </span>

    </div>


    <label>Phone Number</label>

    <input
      id="phone"
      type="tel"
      maxlength="11"
      inputmode="numeric"
      placeholder="08012345678"
    >


    <button id="buyButton" disabled>
      Buy Data
    </button>


    <div class="status" id="status">
      Loading live data plans...
    </div>


    <div class="message success" id="successMessage"></div>

    <div class="message error" id="errorMessage"></div>

  </div>

  <div class="footer">
    Nexora Mobile • Powered by VTUGate
  </div>

</div>


<script>

const API_BASE =
  "https://nexora-ai-backend-hvg7.onrender.com";

const network =
  document.getElementById("network");

const dataType =
  document.getElementById("dataType");

const plan =
  document.getElementById("plan");

const phone =
  document.getElementById("phone");

const buyButton =
  document.getElementById("buyButton");

const statusBox =
  document.getElementById("status");

const planInfo =
  document.getElementById("planInfo");

const selectedPlanName =
  document.getElementById("selectedPlanName");

const selectedPlanPrice =
  document.getElementById("selectedPlanPrice");

const selectedDataType =
  document.getElementById("selectedDataType");

const successMessage =
  document.getElementById("successMessage");

const errorMessage =
  document.getElementById("errorMessage");


let allPlans = [];


/* =========================
   MONEY
========================= */

function money(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "₦0.00";
  }

  return "₦" + n.toLocaleString(
    "en-NG",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}


/* =========================
   MESSAGE
========================= */

function error(message){

  errorMessage.textContent = message;
  errorMessage.style.display = "block";
  successMessage.style.display = "none";

}


function success(message){

  successMessage.textContent = message;
  successMessage.style.display = "block";
  errorMessage.style.display = "none";

}


function clearMessages(){

  errorMessage.style.display = "none";
  successMessage.style.display = "none";

}


/* =========================
   NORMALISE
========================= */

function normalise(p){

  return {

    serviceId:
      p.serviceId ??
      p.service_id ??
      p.serviceID,

    network:
      String(
        p.network ??
        p.network_name ??
        ""
      ).trim().toLowerCase(),

    dataType:
      String(
        p.dataType ??
        p.data_type ??
        p.plan_type ??
        "normal"
      ).trim().toLowerCase(),

    code:
      p.code ??
      p.planCode ??
      p.plan_code,

    name:
      p.name ??
      p.planName ??
      p.plan_name ??
      "Data Plan",

    price:
      Number(
        p.price ??
        p.amount ??
        0
      )

  };

}


/* =========================
   LOAD PLANS
========================= */

async function loadPlans(){

  try{

    statusBox.textContent =
      "Loading live data plans...";


    const response =
      await fetch(
        API_BASE + "/api/data"
      );


    const result =
      await response.json();


    if(!response.ok || !result.success){

      throw new Error(
        result.message ||
        "Unable to load data plans."
      );

    }


    if(!Array.isArray(result.plans)){

      throw new Error(
        "No plans returned by VTUGate."
      );

    }


    allPlans =
      result.plans
        .map(normalise)
        .filter(p =>
          p.serviceId &&
          p.code &&
          p.network &&
          p.dataType
        );


    if(allPlans.length === 0){

      throw new Error(
        "No usable plans found."
      );

    }


    statusBox.textContent =
      "Live plans loaded: " +
      allPlans.length;


    /*
      IMPORTANT FIX:
      Network is already enabled.
      Data Type becomes available after
      a network is selected.
    */

    dataType.disabled = true;

    plan.disabled = true;


  }catch(err){

    console.error(err);

    statusBox.textContent =
      "Unable to load live data plans.";

    error(
      err.message ||
      "Unable to load plans."
    );

  }

}


/* =========================
   NETWORK
========================= */

network.addEventListener(
  "change",
  function(){

    clearMessages();

    dataType.innerHTML =
      '<option value="">Select Data Type</option>';

    plan.innerHTML =
      '<option value="">Select Data Plan</option>';

    dataType.disabled = true;
    plan.disabled = true;

    planInfo.style.display = "none";

    buyButton.disabled = true;


    const selectedNetwork =
      network.value.trim().toLowerCase();


    if(!selectedNetwork){
      return;
    }


    const networkPlans =
      allPlans.filter(
        p =>
          p.network === selectedNetwork
      );


    if(networkPlans.length === 0){

      dataType.innerHTML =
        '<option value="">No data type available</option>';

      return;

    }


    const types =
      [...new Set(
        networkPlans.map(
          p => p.dataType
        )
      )];


    /*
      Put the common types first.
    */

    const order = [
      "sme",
      "dg",
      "awoof",
      "normal"
    ];


    types.sort(
      (a,b) => {

        const A =
          order.indexOf(a);

        const B =
          order.indexOf(b);

        if(A === -1 && B === -1)
          return a.localeCompare(b);

        if(A === -1)
          return 1;

        if(B === -1)
          return -1;

        return A - B;

      }
    );


    types.forEach(
      type => {

        const option =
          document.createElement("option");

        option.value = type;

        option.textContent =
          type.toUpperCase();

        dataType.appendChild(option);

      }
    );


    /*
      IMPORTANT:
      Enable Data Type.
    */

    dataType.disabled = false;

  }
);


/* =========================
   DATA TYPE
========================= */

dataType.addEventListener(
  "change",
  function(){

    clearMessages();

    plan.innerHTML =
      '<option value="">Select Data Plan</option>';

    plan.disabled = true;

    planInfo.style.display = "none";

    buyButton.disabled = true;


    const selectedNetwork =
      network.value.trim().toLowerCase();

    const selectedType =
      dataType.value.trim().toLowerCase();


    if(
      !selectedNetwork ||
      !selectedType
    ){
      return;
    }


    const matchingPlans =
      allPlans.filter(
        p =>
          p.network === selectedNetwork &&
          p.dataType === selectedType
      );


    if(matchingPlans.length === 0){

      plan.innerHTML =
        '<option value="">No plans available</option>';

      return;

    }


    matchingPlans.forEach(
      (p,index) => {

        const option =
          document.createElement("option");

        option.value =
          String(index);

        option.textContent =
          p.name +
          " — " +
          money(p.price);


        option.dataset.serviceId =
          p.serviceId;

        option.dataset.code =
          p.code;

        option.dataset.price =
          p.price;

        option.dataset.name =
          p.name;

        option.dataset.type =
          p.dataType;


        plan.appendChild(option);

      }
    );


    plan.disabled = false;

  }
);


/* =========================
   PLAN
========================= */

plan.addEventListener(
  "change",
  function(){

    clearMessages();

    const option =
      plan.options[
        plan.selectedIndex
      ];


    if(
      !option ||
      !option.value
    ){

      planInfo.style.display = "none";

      buyButton.disabled = true;

      return;

    }


    selectedPlanName.textContent =
      option.dataset.name;


    selectedPlanPrice.textContent =
      "Price: " +
      money(option.dataset.price);


    selectedDataType.textContent =
      option.dataset.type.toUpperCase();


    planInfo.style.display =
      "block";


    checkForm();

  }
);


/* =========================
   PHONE
========================= */

phone.addEventListener(
  "input",
  function(){

    phone.value =
      phone.value
        .replace(/\D/g,"")
        .slice(0,11);

    checkForm();

  }
);


/* =========================
   CHECK FORM
========================= */

function checkForm(){

  const validPhone =
    /^0\d{10}$/.test(
      phone.value
    );


  const option =
    plan.options[
      plan.selectedIndex
    ];


  const validPlan =
    option &&
    option.value &&
    option.dataset.serviceId &&
    option.dataset.code;


  buyButton.disabled =
    !(validPhone && validPlan);

}


/* =========================
   BUY
========================= */

buyButton.addEventListener(
  "click",
  async function(){

    clearMessages();

    const option =
      plan.options[
        plan.selectedIndex
      ];


    const serviceId =
      Number(
        option.dataset.serviceId
      );

    const planCode =
      option.dataset.code;

    const amount =
      Number(
        option.dataset.price
      );


    buyButton.disabled = true;

    buyButton.textContent =
      "Processing...";


    try{

      const response =
        await fetch(
          API_BASE +
          "/api/data/purchase",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                service_id:
                  serviceId,

                phone_number:
                  phone.value,

                amount:
                  amount,

                plan_code:
                  planCode

              })

          }
        );


      const result =
        await response.json();


      if(
        !response.ok ||
        result.success === false
      ){

        throw new Error(
          result.message ||
          "Purchase failed."
        );

      }


      success(
        result.message ||
        "Data purchase successful."
      );


      statusBox.textContent =
        "Purchase completed successfully.";

    }
    catch(err){

      console.error(err);

      error(
        err.message ||
        "Purchase failed."
      );

    }
    finally{

      buyButton.textContent =
        "Buy Data";

      checkForm();

    }

  }
);


/* =========================
   START
========================= */

loadPlans();

</script>

</body>
</html>
