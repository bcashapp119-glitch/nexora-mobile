<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Mobile - Buy Data</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      color: #111827;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .wallet {
      background: #111827;
      color: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }
    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }
    select:disabled {
      background: #f3f4f6;
      color: #6b7280;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
    button:disabled {
      opacity: .6;
    }
    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      font-size: 14px;
    }
    .footer {
      text-align: center;
      margin-top: 25px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Buy Data</h1>
  <div class="wallet">
    Wallet Balance: ₦1,500.00
  </div>
  <div class="card">
    <label for="network">Network</label>
    <select id="network">
      <option value="">Select Network</option>
      <option value="mtn">MTN</option>
      <option value="glo">Glo</option>
      <option value="airtel">Airtel</option>
      <option value="9mobile">9mobile</option>
    </select>
    <label for="plan">Data Plan</label>
    <select id="plan" disabled>
      <option value="">Loading live data plans...</option>
    </select>
    <label for="phone">Phone Number</label>
    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      maxlength="11"
      placeholder="Enter 11-digit phone number"
    >
    <button id="buyBtn" type="button">
      Buy Data
    </button>
    <div id="status">
      Loading live data plans...
    </div>
  </div>
  <div class="footer">
    Nexora Mobile • Powered by VTUGate
  </div>
</div>
<script>
  const BACKEND_URL =
    "https://nexora-ai-backend-hvg7.onrender.com";
  const networkSelect =
    document.getElementById("network");
  const planSelect =
    document.getElementById("plan");
  const phoneInput =
    document.getElementById("phone");
  const buyBtn =
    document.getElementById("buyBtn");
  const statusBox =
    document.getElementById("status");
  let allPlans = [];
  function money(amount) {
    return Number(amount).toLocaleString("en-NG", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }
  function setStatus(message) {
    statusBox.textContent = message;
  }
  async function loadPlans() {
    try {
      setStatus("Loading live data plans...");
      const response = await fetch(
        BACKEND_URL + "/api/vtu/data-plans"
      );
      if (!response.ok) {
        throw new Error(
          "Server error: " + response.status
        );
      }
      const data = await response.json();
      console.log("LIVE VTUGATE DATA:", data);
      if (
        !data ||
        data.success !== true ||
        !Array.isArray(data.plans)
      ) {
        throw new Error(
          "Invalid plans received from server."
        );
      }
      allPlans = data.plans;
      planSelect.innerHTML =
        '<option value="">Select Data Plan</option>';
      planSelect.disabled = true;
      setStatus(
        "Live plans loaded: " +
        allPlans.length
      );
      console.log(
        "Total live plans:",
        allPlans.length
      );
    } catch (error) {
      console.error(
        "LOAD PLANS ERROR:",
        error
      );
      planSelect.innerHTML =
        '<option value="">Unable to load plans</option>';
      planSelect.disabled = true;
      setStatus(
        "Unable to load live data plans."
      );
    }
  }
  networkSelect.addEventListener(
    "change",
    function () {
      const selectedNetwork =
        String(this.value)
          .trim()
          .toLowerCase();
      console.log(
        "NETWORK SELECTED:",
        selectedNetwork
      );
      planSelect.innerHTML =
        '<option value="">Select Data Plan</option>';
      if (!selectedNetwork) {
        planSelect.disabled = true;
        setStatus(
          "Please select a network."
        );
        return;
      }
      const matchingPlans =
        allPlans.filter(function (plan) {
          return String(plan.network)
            .trim()
            .toLowerCase() === selectedNetwork;
        });
      console.log(
        "MATCHING PLANS:",
        matchingPlans
      );
      if (matchingPlans.length === 0) {
        planSelect.innerHTML =
          '<option value="">No plans available</option>';
        planSelect.disabled = true;
        setStatus(
          "No plans available for " +
          selectedNetwork.toUpperCase()
        );
        return;
      }
      matchingPlans.forEach(function (plan) {
        const option =
          document.createElement("option");
        option.value =
          JSON.stringify({
            serviceId: plan.serviceId,
            code: plan.code,
            price: plan.price,
            name: plan.name,
            network: plan.network
          });
        option.textContent =
          plan.name +
          " — ₦" +
          money(plan.price);
        planSelect.appendChild(option);
      });
      planSelect.disabled = false;
      setStatus(
        matchingPlans.length +
        " " +
        selectedNetwork.toUpperCase() +
        " plans available."
      );
    }
  );
  buyBtn.addEventListener(
    "click",
    async function () {
      const network =
        networkSelect.value;
      const phone =
        phoneInput.value.trim();
      const selectedValue =
        planSelect.value;
      if (!network) {
        alert(
          "Please select a network."
        );
        return;
      }
      if (!selectedValue) {
        alert(
          "Please select a data plan."
        );
        return;
      }
      if (!/^[0-9]{11}$/.test(phone)) {
        alert(
          "Please enter a valid 11-digit Nigerian phone number."
        );
        return;
      }
      let plan;
      try {
        plan =
          JSON.parse(selectedValue);
      } catch (error) {
        alert(
          "Invalid data plan selected."
        );
        return;
      }
      const confirmation =
        confirm(
          "Confirm Data Purchase\n\n" +
          "Network: " +
          network.toUpperCase() +
          "\n\n" +
          "Plan: " +
          plan.name +
          "\n\n" +
          "Phone: " +
          phone +
          "\n\n" +
          "Amount: ₦" +
          money(plan.price)
        );
      if (!confirmation) {
        return;
      }
      buyBtn.disabled = true;
      buyBtn.textContent =
        "Processing...";
      setStatus(
        "Processing your data purchase..."
      );
      try {
        const response =
          await fetch(
            BACKEND_URL +
            "/api/vtu/buy-data",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                serviceId:
                  Number(plan.serviceId),
                code:
                  plan.code,
                phone:
                  phone,
                network:
                  network,
                amount:
                  Number(plan.price),
                planName:
                  plan.name
              })
            }
          );
        const result =
          await response.json();
        console.log(
          "PURCHASE RESULT:",
          result
        );
        if (
          !response.ok ||
          result.success === false
        ) {
          throw new Error(
            result.message ||
            "Data purchase failed."
          );
        }
        alert(
          "Data purchase successful!\n\n" +
          plan.name +
          "\n" +
          "Phone: " +
          phone
        );
        setStatus(
          "Data purchase successful."
        );
      } catch (error) {
        console.error(
          "PURCHASE ERROR:",
          error
        );
        alert(
          "Purchase failed.\n\n" +
          error.message
        );
        setStatus(
          "Purchase failed. Please try again."
        );
      } finally {
        buyBtn.disabled = false;
        buyBtn.textContent =
          "Buy Data";
      }
    }
  );
  // Start loading live plans
  loadPlans();
</script>
</body>
</html>
