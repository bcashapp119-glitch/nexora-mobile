<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Fund Wallet</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f3f6fb;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#2563eb;
}

input{
width:100%;
padding:14px;
margin:15px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

</style>

</head>

<body>


<div class="container">

<h1>Fund Wallet</h1>

<input id="amount" type="number" placeholder="Enter amount">

<button id="fundBtn">
Add Money
</button>

<p id="message"></p>

</div>



<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
updateDoc,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



const firebaseConfig = {

apiKey:"AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",

authDomain:"nexora-mobile-af02f.firebaseapp.com",

projectId:"nexora-mobile-af02f",

storageBucket:"nexora-mobile-af02f.firebasestorage.app",

messagingSenderId:"498265618137",

appId:"1:498265618137:web:a1ffebae8eda0b88abf0c8",

measurementId:"G-8494CNWZKL"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


let currentUser = null;


onAuthStateChanged(auth,(user)=>{

currentUser=user;

});



document.getElementById("fundBtn").onclick = async()=>{


const amount = Number(
document.getElementById("amount").value
);



if(!currentUser){

document.getElementById("message").innerHTML =
"Please login first";

return;

}



if(amount <= 0){

document.getElementById("message").innerHTML =
"Enter a valid amount";

return;

}



const userRef = doc(
db,
"users",
currentUser.uid
);



const userSnap = await getDoc(userRef);


const oldWallet =
userSnap.data().wallet || 0;



await updateDoc(userRef,{

wallet: oldWallet + amount

});



await addDoc(
collection(db,"transactions"),
{

userId: currentUser.uid,

type:"Wallet Funding",

amount:amount,

status:"Successful",

createdAt:serverTimestamp()

});



document.getElementById("message").innerHTML =
"Wallet funded successfully";


};


</script>


</body>
</html>
