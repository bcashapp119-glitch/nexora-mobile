<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Fund Wallet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f3f6fb;
}

.container {
    max-width: 420px;
    margin: 30px auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #2563eb;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#message {
    margin-top: 15px;
    text-align: center;
}

.payment-box {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #f8fafc;
    border-radius: 15px;
    border: 1px solid #e2e8f0;
}

.payment-box h2 {
    margin-top: 0;
    font-size: 20px;
}

.payment-row {
    margin: 12px 0;
}

.payment-label {
    font-size: 13px;
    color: #64748b;
}

.payment-value {
    font-size: 17px;
    font-weight: bold;
    margin-top: 4px;
}

.warning {
    margin-top: 15px;
    padding: 12px;
    background: #fff7ed;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
}

.back-btn {
    margin-top: 15px;
    background: #64748b;
}
</style>
</head>

<body>

<div class="container">

    <h1>Fund Wallet</h1>

    <label for="amount">Amount</label>

    <input
        id="amount"
        type="number"
        inputmode="numeric"
        min="100"
        step="1"
        placeholder="Enter amount e.g. 1000"
    >

    <button id="fundBtn">
        Continue
    </button>

    <p id="message"></p>

    <div class="payment-box" id="paymentBox">

        <h2>Pay with OPay</h2>

        <div class="payment-row">
            <div class="payment-label">Amount to pay</div>
            <div class="payment-value" id="paymentAmount">
                ₦0
            </div>
        </div>

        <div class="payment-row">
            <div class="payment-label">OPay Business Account</div>
            <div class="payment-value">
                YOUR OPAY BUSINESS NO.
            </div>
        </div>

        <div class="warning">
            Send exactly the amount shown above to the
            Nexora OPay Business account.
            <br><br>
            Your wallet will only be credited after the
            payment has been properly verified.
        </div>

        <button class="back-btn" id="backBtn">
            Change Amount
        </button>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",

    authDomain: "nexora-mobile-af02f.firebaseapp.com",

    projectId: "nexora-mobile-af02f",

    storageBucket: "nexora-mobile-af02f.firebasestorage.app",

    messagingSenderId: "498265618137",

    appId: "1:498265618137:web:a1ffebae8eda0b88abf0c8",

    measurementId: "G-8494CNWZKL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


let currentUser = null;


onAuthStateChanged(auth, (user) => {

    currentUser = user;

});


const amountInput =
    document.getElementById("amount");

const fundBtn =
    document.getElementById("fundBtn");

const message =
    document.getElementById("message");

const paymentBox =
    document.getElementById("paymentBox");

const paymentAmount =
    document.getElementById("paymentAmount");

const backBtn =
    document.getElementById("backBtn");


fundBtn.addEventListener("click", () => {

    if (!currentUser) {

        message.textContent =
            "Please login first.";

        return;
    }


    const rawAmount =
        amountInput.value.trim();


    if (rawAmount === "") {

        message.textContent =
            "Please enter an amount.";

        amountInput.focus();

        return;
    }


    const amount =
        Number(rawAmount);


    if (!Number.isFinite(amount) || amount < 100) {

        message.textContent =
            "Enter a valid amount of at least ₦100.";

        amountInput.focus();

        return;
    }


    if (!Number.isInteger(amount)) {

        message.textContent =
            "Please enter a whole naira amount.";

        amountInput.focus();

        return;
    }


    paymentAmount.textContent =
        "₦" + amount.toLocaleString("en-NG");


    message.textContent = "";


    paymentBox.style.display = "block";


    fundBtn.style.display = "none";

});


backBtn.addEventListener("click", () => {

    paymentBox.style.display = "none";

    fundBtn.style.display = "block";

    amountInput.focus();

});

</script>

</body>
</html>
