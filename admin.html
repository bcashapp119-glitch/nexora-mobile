<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Admin Dashboard</title>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #2563eb;
}

.card {
    background: white;
    padding: 15px;
    margin: 15px 0;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

input {
    width: 90%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

</style>

</head>


<body>


<div class="container">

<div id="app">

<h1>Loading Nexora Admin...</h1>

</div>

</div>



<script type="module" src="./admin.js"></script>


</body>

</html>
