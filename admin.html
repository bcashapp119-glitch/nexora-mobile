<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#111827;
height:100vh;
}

.sidebar{
width:250px;
background:#1F2937;
color:white;
padding:20px;
}

.logo{
font-size:26px;
font-weight:bold;
margin-bottom:40px;
}

.menu{
display:flex;
flex-direction:column;
gap:18px;
}

.menu a{
text-decoration:none;
color:white;
padding:12px;
border-radius:10px;
transition:.3s;
}

.menu a:hover{
background:#374151;
}

.main{
flex:1;
background:#F3F4F6;
padding:30px;
overflow:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:10px;
color:#6B7280;
}

.card h2{
font-size:28px;
}

.green{
color:#22C55E;
}

.orange{
color:#F59E0B;
}

.red{
color:#EF4444;
}

</style>

</div>

<div class="cards">

<div class="card">

<h3>Total Users</h3>

</div>

<div class="card">

</div>

<div class="card">

</div>

<div class="card">
