<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Mobile Account</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
}

.header{
    background:#2563eb;
    color:white;
    padding:25px;
    text-align:center;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.status{
    color:green;
    font-weight:bold;
}

.profile{
    text-align:center;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:30px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#dc2626;
    color:white;
    font-size:16px;
}

.service{
    display:flex;
    justify-content:space-between;
    padding:12px;
    border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<div class="header">
<h1>Nexora Mobile</h1>
<p>My Account</p>
</div>


<div class="container">


<div class="card profile">

<div class="avatar">
👤
</div>

<h2 id="username">Loading...</h2>

<p id="email">Loading...</p>

<p class="status">
● Account Signed In
</p>

</div>


<div class="card">

<h2>Wallet</h2>

<h1>₦0.00</h1>

<p>Your balance will appear here.</p>

</div>


<div class="card">

<h2>Services</h2>

<div class="service">
<span>📱 Airtime</span>
<span>Available</span>
</div>

<div class="service">
<span>📶 Data</span>
<span>Available</span>
</div>

<div class="service">
<span>🌍 eSIM</span>
<span>Available</span>
</div>

<div class="service">
<span>🎟 E-PIN</span>
<span>Available</span>
</div>

</div>


<div class="card">

<button id="logout">
Logout
</button>

</div>


</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",
authDomain: "nexora-mobile-af02f.firebaseapp.com",
projectId: "nexora-mobile-af02f",
storageBucket: "nexora-mobile-af02f.firebasestorage.app",
messagingSenderId: "498265618137",
appId: "1:498265618137:web:a1ffebae8eda0b88abf0c8",
measurementId: "G-8494CNWZKL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("email").innerHTML =
user.email;

document.getElementById("username").innerHTML =
user.displayName || "Nexora User";

}

else{

window.location.href="login.html";

}

});


document.getElementById("logout").onclick = ()=>{

signOut(auth).then(()=>{

window.location.href="login.html";

});

};


</script>


</body>
</html>
