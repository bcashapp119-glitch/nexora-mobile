<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f3f6fb;
margin:0;
}

.top{
background:#2563eb;
color:white;
padding:25px;
border-radius:0 0 25px 25px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.wallet{
background:#2563eb;
color:white;
}

.balance{
font-size:35px;
font-weight:bold;
}

.services{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.service{
background:#eef2ff;
padding:20px;
border-radius:15px;
text-align:center;
}

.transaction{
border-bottom:1px solid #ddd;
padding:10px 0;
}

button{
width:100%;
padding:15px;
background:#dc2626;
color:white;
border:none;
border-radius:12px;
}
</style>

</head>

<body>


<div class="top">
<h1>Hello, <span id="name">User</span> 👋</h1>
<p>Nexora Mobile</p>
</div>


<div class="container">


<div class="card wallet">

<h2>Wallet Balance</h2>

<div class="balance">
₦<span id="wallet">0</span>
</div>

</div>



<div class="card">

<h2>Account</h2>

<p>Email:</p>
<b id="email">Loading...</b>

<p>Status:</p>
<b id="status">Loading...</b>

</div>



<div class="card">

<h2>Services</h2>

<div class="services">

<a href="fund-wallet.html" style="text-decoration:none;color:black;">
<div class="service">
💰 Fund Wallet
</div>
</a>

<a href="airtime.html" style="text-decoration:none;color:black;">
<div class="service">
📱 Airtime
</div>
</a>

<a href="data.html" style="text-decoration:none;color:black;">
<div class="service">
📶 Data
</div>
</a>

<a href="esim.html" style="text-decoration:none;color:black;">
  <div class="service">
    🌍 eSIM
  </div>
</a>

</div>

</div>



<div class="card">

<h2>Transaction History</h2>

<div id="transactions">
Loading...
</div>

</div>



<div class="card">

<button id="logout">
Logout
</button>

</div>


</div>



<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs,
orderBy
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
apiKey:"AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",
authDomain:"nexora-mobile-af02f.firebaseapp.com",
projectId:"nexora-mobile-af02f",
storageBucket:"nexora-mobile-af02f.firebasestorage.app",
messagingSenderId:"498265618137",
appId:"1:498265618137:web:a1ffebae8eda0b88abf0c8",
measurementId:"G-8494CNWZKL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



onAuthStateChanged(auth, async(user)=>{


if(user){


const userRef = doc(db,"users",user.uid);

const userSnap = await getDoc(userRef);



if(userSnap.exists()){

const data=userSnap.data();


document.getElementById("name").innerHTML=data.name;

document.getElementById("email").innerHTML=data.email;

document.getElementById("wallet").innerHTML=data.wallet;

document.getElementById("status").innerHTML=data.status;


}



const q = query(

collection(db,"transactions"),

where("userId","==",user.uid)

);


const result = await getDocs(q);


let html="";


result.forEach((item)=>{


const t=item.data();


html += `

<div class="transaction">

<b>${t.type}</b>

<br>

Amount: ₦${t.amount}

<br>

Status: ${t.status}

</div>

`;

});


document.getElementById("transactions").innerHTML =
html || "No transactions yet";


}else{

window.location.href="login.html";

}


});



document.getElementById("logout").onclick=()=>{

signOut(auth).then(()=>{

window.location.href="login.html";

});

};


</script>


</body>
</html>
