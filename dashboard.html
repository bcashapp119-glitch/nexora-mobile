<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Mobile Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
}

header{
    background:#08152f;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    padding:25px;
}

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    color:#2563eb;
}

.button{
    display:block;
    background:#2563eb;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
    text-decoration:none;
}

.logout{
    background:#dc2626;
}

</style>

</head>

<body>

<header>
<h1>Nexora Mobile</h1>
<p id="userEmail">Welcome</p>
</header>


<div class="container">

<div class="card">
<h2>💰 Wallet</h2>
<p>Balance: ₦0.00</p>
</div>


<div class="card">
<h2>📱 Airtime</h2>
<p>Buy airtime instantly.</p>
<a href="airtime.html" class="button">Buy Airtime</a>
</div>


<div class="card">
<h2>📶 Data</h2>
<p>Purchase data bundles.</p>
<a href="data.html" class="button">Buy Data</a>
</div>


<div class="card">
<h2>🌍 eSIM</h2>
<p>Get international eSIM plans.</p>
<a href="esim.html" class="button">Buy eSIM</a>
</div>


<div class="card">
<a href="index.html" class="button logout">Logout</a>
</div>


</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",
authDomain: "nexora-mobile-af02f.firebaseapp.com",
projectId: "nexora-mobile-af02f",
storageBucket: "nexora-mobile-af02f.firebasestorage.app",
messagingSenderId: "498265618137",
appId: "1:498265618137:web:a1ffebae8eda0b88abf0c8",
measurementId: "G-8494CNWZKL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("userEmail").innerHTML =
"Welcome, " + user.email;

}else{

window.location.href="login.html";

}

});


</script>

</body>
</html>
