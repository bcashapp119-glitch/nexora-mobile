<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Mobile - Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  background:white;
  width:100%;
  max-width:400px;
  padding:30px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.logo{
  text-align:center;
  font-size:27px;
  font-weight:bold;
  color:#2563eb;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.forgot{
  display:block;
  text-align:right;
  margin:-3px 0 18px;
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
}

.links{
  text-align:center;
  margin-top:20px;
  color:#6b7280;
}

.links a{
  color:#2563eb;
  text-decoration:none;
  font-weight:bold;
}

#message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">Nexora Mobile</div>

  <div class="subtitle">Login to your account</div>

  <input
    id="email"
    type="email"
    placeholder="Email Address"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <a class="forgot" href="forgot-password.html">
    Forgot Password?
  </a>

  <button id="loginBtn">
    Login
  </button>

  <p id="message"></p>

  <div class="links">
    Don't have an account?
    <a href="signup.html">Create Account</a>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",
  authDomain: "nexora-mobile-af02f.firebaseapp.com",
  projectId: "nexora-mobile-af02f",
  storageBucket: "nexora-mobile-af02f.firebasestorage.app",
  messagingSenderId: "498265618137",
  appId: "1:498265618137:web:a1ffebae8eda0b88abf0c8",
  measurementId: "G-8494CNWZKL"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");


    if (!email || !password) {
      message.textContent =
        "Please enter your email and password.";
      return;
    }


    message.textContent = "Logging in...";


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      message.textContent =
        "Login successful!";


      setTimeout(() => {

        if (
          email.toLowerCase() ===
          "sufiyanolawale36@gmail.com"
        ) {

          window.location.href = "admin.html";

        } else {

          window.location.href = "dashboard.html";

        }

      }, 800);


    } catch (error) {

      message.textContent =
        error.message;

    }

  });

</script>

</body>
</html>
