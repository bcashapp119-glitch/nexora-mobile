<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Mobile - Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.login-box{
background:white;
width:90%;
max-width:420px;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.logo{
text-align:center;
font-size:30px;
font-weight:700;
color:#2563eb;
margin-bottom:20px;
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
font-size:16px;
}

.signup{
text-align:center;
margin-top:20px;
}

.signup a{
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
Nexora Mobile
</div>

<h2>
Login
</h2>

<form>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">

<button type="button">
Login
</button>

</form>

<div class="signup">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</div>

</div>

</body>

</html>
