<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Mobile - Login</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    width:90%;
    max-width:400px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#2563eb;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

a{
    display:block;
    text-align:center;
    margin-top:15px;
}

#message{
    text-align:center;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="container">

<h1>Nexora Login</h1>

<input id="email" type="email" placeholder="Email Address">

<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>

<p id="message"></p>

<a href="signup.html">Create a new account</a>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyDHwh66V6cT7nqEP9R7Iy827vbtBjQGeIA",
authDomain: "nexora-mobile-af02f.firebaseapp.com",
projectId: "nexora-mobile-af02f",
storageBucket: "nexora-mobile-af02f.firebasestorage.app",
messagingSenderId: "498265618137",
appId: "1:498265618137:web:a1ffebae8eda0b88abf0c8",
measurementId: "G-8494CNWZKL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


document.getElementById("loginBtn").addEventListener("click", async()=>{

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const message = document.getElementById("message");


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

message.innerHTML="Login successful!";

setTimeout(()=>{
window.location.href="index.html";
},1500);


}

catch(error){

message.innerHTML=error.message;

}

});


</script>

</body>
</html>
