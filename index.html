<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Mobile Login</title>

<style>

body{
    margin:0;
    padding:0;
    background:#f5f7fb;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    background:white;
    width:90%;
    max-width:400px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    text-align:center;
}

h1{
    color:#2563eb;
}

input{
    width:90%;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
}

a{
    color:#2563eb;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-container">

<h1>Nexora Mobile</h1>

<h2>Login</h2>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">

<button>
Login
</button>

<p>
Don't have an account?
<a href="signup.html">
Create Account
</a>
</p>

</div>

</body>

</html>
