<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Mobile</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#101828;
  padding-bottom:80px;
}

header{
  background:#101828;
  color:white;
  padding:24px 18px;
}

header h1{
  font-size:28px;
  margin-bottom:8px;
}

header p{
  color:#d0d5dd;
  font-size:16px;
}

.search{
  margin-top:20px;
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  font-size:16px;
}

.container{
  width:92%;
  max-width:700px;
  margin:25px auto;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:22px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
}

input,select{
  width:100%;
  padding:15px;
  border:1px solid #d0d5dd;
  border-radius:12px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:16px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#2864e8;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.payment{
  background:#101828;
  color:white;
}

.payment p{
  color:#d0d5dd;
  line-height:1.6;
}

.notice{
  margin-top:15px;
  padding:14px;
  background:#eef4ff;
  color:#174ea6;
  border-radius:10px;
  font-size:14px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:12px 5px;
  box-shadow:0 -3px 12px rgba(0,0,0,.12);
}

nav a{
  text-decoration:none;
  color:#344054;
  text-align:center;
  font-size:13px;
}

nav span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.success{
  display:none;
  background:#ecfdf3;
  color:#067647;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<header>
  <h1>🌍 Nexora Mobile</h1>
  <p>Stay Connected Anywhere</p>
  <input class="search" type="search"
    placeholder="Search eSIM, airtime or data...">
</header>

<div class="container">

  <div class="card">
    <h2>📱 eSIM Plans</h2>
    <p>Browse affordable international eSIM plans.</p>
    <button onclick="showMessage('eSIM plans will be available here.')">
      View eSIM Plans
    </button>
  </div>

  <div class="card" id="airtime">
    <h2>📶 Buy Airtime or Data</h2>

    <label>Choose Network</label>
    <select id="network">
      <option>MTN</option>
      <option>Airtel</option>
      <option>Glo</option>
      <option>9mobile</option>
    </select>

    <label>Phone Number</label>
    <input id="phone" type="tel"
      placeholder="08012345678">

    <label>Choose Service</label>
    <select id="service">
      <option>Airtime</option>
      <option>Data</option>
    </select>

    <label>Amount</label>
    <select id="amount">
      <option>₦100</option>
      <option>₦200</option>
      <option>₦500</option>
      <option>₦1,000</option>
      <option>₦2,000</option>
      <option>₦5,000</option>
    </select>

    <button onclick="continuePayment()">
      Continue to Payment
    </button>

    <div id="success" class="success"></div>
  </div>

  <div class="card payment" id="payment">
    <h2>💳 Payment</h2>
    <p>
      Select your service, enter your details,
      and proceed to payment.
    </p>

    <div class="notice">
      Payment methods can be connected here later.
    </div>

    <button onclick="showMessage('Payment setup coming next.')">
      Choose Payment Method
    </button>
  </div>

</div>

<nav>
  <a href="#"><span>🏠</span>Home</a>
  <a href="#esim"><span>📱</span>eSIM</a>
  <a href="#airtime"><span>📶</span>Airtime</a>
  <a href="#payment"><span>💳</span>Payment</a>
  <a href="#"><span>💬</span>Help</a>
</nav>

<script>
function continuePayment(){

  const phone = document.getElementById("phone").value.trim();
  const network = document.getElementById("network").value;
  const service = document.getElementById("service").value;
  const amount = document.getElementById("amount").value;
  const success = document.getElementById("success");

  if(phone === ""){
    alert("Please enter your phone number.");
    return;
  }

  success.style.display = "block";

  success.innerHTML =
    "<strong>Order details</strong><br>" +
    "Network: " + network + "<br>" +
    "Phone: " + phone + "<br>" +
    "Service: " + service + "<br>" +
    "Amount: " + amount;

  document.getElementById("payment").scrollIntoView({
    behavior:"smooth"
  });
}

function showMessage(message){
  alert(message);
}
</script>

</body>
</html>
