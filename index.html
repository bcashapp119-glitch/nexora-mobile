<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Mobile</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f9;
  color: #111827;
  padding-bottom: 85px;
}

.header {
  background: #10182c;
  color: white;
  padding: 28px 25px 35px;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.tagline {
  margin-top: 10px;
  font-size: 18px;
  color: #d7dbe5;
}

.search {
  margin-top: 28px;
  width: 100%;
  padding: 20px;
  border-radius: 22px;
  border: none;
  font-size: 17px;
}

.container {
  padding: 22px;
}

.card {
  background: white;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 25px;
  box-shadow: 0 5px 18px rgba(0,0,0,.06);
}

.card h2 {
  margin-top: 0;
}

button {
  width: 100%;
  border: none;
  padding: 17px;
  border-radius: 15px;
  background: #2864e8;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

select,
input {
  width: 100%;
  padding: 16px;
  margin: 10px 0 15px;
  border: 1px solid #d5d9e1;
  border-radius: 13px;
  font-size: 16px;
  background: white;
}

.payment-option {
  border: 2px solid #e0e4eb;
  border-radius: 18px;
  padding: 18px;
  margin: 12px 0;
  cursor: pointer;
}

.payment-option:hover {
  border-color: #2864e8;
}

.payment-option strong {
  font-size: 18px;
}

.transaction {
  border: 1px solid #e1e5eb;
  border-radius: 17px;
  padding: 17px;
  margin-bottom: 13px;
  background: white;
}

.status {
  display: inline-block;
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}

.success {
  background: #dcfce7;
  color: #15803d;
}

.pending {
  background: #fef3c7;
  color: #a16207;
}

.failed {
  background: #fee2e2;
  color: #b91c1c;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 78px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1000;
}

.nav-item {
  text-align: center;
  font-size: 12px;
  color: #4b5563;
  cursor: pointer;
}
