<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Mobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 28px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: 0.8;
    }

    main {
      padding: 20px;
    }

    .welcome {
      background: #111827;
      color: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-top: 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .icon {
      font-size: 24px;
      margin-right: 8px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>NEXORA</h1>
      <p>Mobile Services</p>
    </header>

    <main>

      <section class="welcome">
        <h2>Welcome to Nexora Mobile</h2>
        <p>
          Your simple platform for airtime, data and eSIM services.
        </p>
      </section>

      <section class="card">
        <h3>👤 Account</h3>

        <button onclick="alert('Create Account selected')">
          <span class="icon">👤</span>
          Create Account
        </button>

        <button
          class="secondary"
          onclick="alert('Login selected')">

          <span class="icon">🔐</span>
          Login

        </button>
      </section>

      <section class="card">
        <h3>📱 Airtime</h3>
        <p>Buy airtime quickly.</p>

        <button onclick="alert('Airtime selected')">
          Buy Airtime
        </button>
      </section>

      <section class="card">
        <h3>📶 Data</h3>
        <p>Choose your preferred data bundle.</p>

        <button onclick="alert('Data selected')">
          Buy Data
        </button>
      </section>

      <section class="card">
        <h3>🌐 eSIM</h3>
        <p>Get an eSIM plan.</p>

        <button onclick="alert('eSIM selected')">
          Buy eSIM
        </button>
      </section>

    </main>

    <footer>
      © 2026 Nexora Mobile
    </footer>

  </div>

</body>
</html>
